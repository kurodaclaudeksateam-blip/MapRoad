<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>MapRoad · Control de Rutas y Entregas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ============================================================
   MapRoad — Panel web (datos en Supabase, tablas _mpr)
   Paleta y tipografía adaptadas de Argon Dashboard PRO (Material UI):
   https://demos.creative-tim.com/argon-dashboard-pro-material-ui/
   (solo estilo/UX propio — sin copiar assets ni código de ese sitio)
   ============================================================ */
:root{
  --bg:#344767; --bg-soft:#1a2035; --panel:#ffffff; --panel-2:#f8f9fa;
  --border:#e9ecef; --text:#252f40; --text-soft:#67748e; --text-mute:#8392ab;
  --dark:#344767; --dark-2:#1a2035;
  --primary:#11cdef; --primary-dark:#0da5c0; --primary-soft:#e0f7fc;
  --success:#2dce89; --success-soft:#e3fbf1;
  --warning:#fb6340; --warning-soft:#feefe9;
  --danger:#f5365c; --danger-soft:#fde6ea;
  --sidebar-w:250px; --radius:16px; --shadow:0 0 20px rgba(103,116,142,.12);
  --shadow-lg:0 12px 28px rgba(20,28,46,.12);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --font:"Open Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font);background:var(--panel-2);color:var(--text);font-size:14px;line-height:1.45;}
#app{min-height:100vh;}
a{color:var(--primary);text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea,button{font-size:14px;font-family:inherit;}
h1,h2,h3,h4{margin:0 0 4px;font-weight:700;}
.hidden{display:none !important;}
.muted{color:var(--text-soft);}
.mute2{color:var(--text-mute);}
.mono{font-family:var(--mono);}
.small{font-size:12px;}

/* ---------- Layout shell (estilo Argon: sidebar clara flotante) ---------- */
.shell{display:flex;min-height:100vh;background:var(--panel-2);}
.sidebar{width:var(--sidebar-w);background:var(--panel);color:var(--text);flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;box-shadow:var(--shadow-lg);z-index:10;}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:20px 16px;border-bottom:1px solid var(--border);}
.sidebar .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(310deg,var(--dark),var(--primary));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;box-shadow:0 4px 10px rgba(52,71,103,.3);}
.sidebar .brand b{font-size:16px;color:var(--text);}
.sidebar .brand span{display:block;font-size:11px;color:var(--text-mute);}
.nav{padding:12px;flex:1;}
.nav .grp{margin:16px 10px 8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-mute);font-weight:700;}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--text-soft);font-size:13.5px;font-weight:600;margin-bottom:3px;transition:background .15s,color .15s;}
.nav a:hover{background:var(--panel-2);color:var(--text);}
.nav a.active{background:linear-gradient(310deg,var(--dark),var(--dark-2));color:#fff;box-shadow:0 4px 10px rgba(52,71,103,.3);}
.nav a .ic{width:26px;height:26px;border-radius:8px;background:var(--panel-2);display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.nav a.active .ic{background:rgba(255,255,255,.18);}
.sidebar .foot{padding:14px 12px;border-top:1px solid var(--border);}
.userbox{display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;background:var(--panel-2);}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(310deg,var(--dark),var(--primary));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.userbox .who b{display:block;font-size:12.5px;color:var(--text);}
.userbox .who span{font-size:11px;color:var(--text-mute);text-transform:capitalize;}
.btn-logout{margin-top:8px;width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text-soft);padding:7px;border-radius:10px;font-weight:600;}
.btn-logout:hover{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-soft);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 26px;background:var(--panel-2);border-bottom:none;position:sticky;top:0;z-index:5;}
.topbar h1{font-size:19px;color:var(--text);}
.content{padding:8px 26px 26px;flex:1;}

/* ---------- Generic UI ---------- */
.grid{display:grid;gap:16px;}
.cols-4{grid-template-columns:repeat(4,1fr);}
.cols-3{grid-template-columns:repeat(3,1fr);}
.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.cols-4{grid-template-columns:repeat(2,1fr);}.cols-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.cols-4,.cols-3{grid-template-columns:1fr;}}

/* Banner de bienvenida (encabezado del Dashboard) — imagen intercambiable en
   assets/header-vehicle.svg. Se muestra a la mitad (50%) de su tamaño base. */
.welcome-banner{background:linear-gradient(310deg,var(--dark),var(--dark-2));border-radius:var(--radius);padding:26px 32px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:20px;color:#fff;box-shadow:var(--shadow-lg);overflow:hidden;}
.welcome-banner h2{font-size:22px;color:#fff;margin:2px 0 6px;}
.welcome-banner .vehicle-img{width:50%;max-width:220px;height:auto;flex-shrink:0;filter:drop-shadow(0 10px 18px rgba(0,0,0,.3));}
@media(max-width:820px){.welcome-banner{flex-direction:column;text-align:center;padding:22px;} .welcome-banner .vehicle-img{max-width:160px;}}

.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.card h3{font-size:13px;color:var(--text-soft);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
.stat{font-size:26px;font-weight:800;margin-top:4px;}
.stat.small-stat{font-size:20px;}
.trend{font-size:12px;margin-top:2px;}
.trend.up{color:var(--success);} .trend.down{color:var(--danger);}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;}
.panel-b{padding:18px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:9px 10px;background:var(--panel-2);color:var(--text-soft);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:hover td{background:#f8fafc;}
.table-wrap{overflow-x:auto;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge.b-green{background:var(--success-soft);color:#1a9c6b;}
.badge.b-amber{background:var(--warning-soft);color:#c94a2c;}
.badge.b-red{background:var(--danger-soft);color:#c81e4a;}
.badge.b-blue{background:var(--primary-soft);color:#0a8aa3;}
.badge.b-gray{background:var(--panel-2);color:var(--text-soft);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);font-weight:600;font-size:13px;transition:box-shadow .15s,background .15s;}
.btn:hover{background:var(--panel-2);}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 8px rgba(17,205,239,.35);}
.btn.primary:hover{background:var(--primary-dark);box-shadow:0 6px 12px rgba(17,205,239,.4);}
.btn.success{background:var(--success);border-color:var(--success);color:#fff;box-shadow:0 4px 8px rgba(45,206,137,.35);}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;box-shadow:0 4px 8px rgba(245,54,92,.35);}
.btn.ghost{background:transparent;border-color:transparent;}
.btn.sm{padding:5px 12px;font-size:12px;}
.btn.block{width:100%;justify-content:center;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.icon-btn{border:1px solid var(--border);background:#fff;border-radius:8px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;}
.icon-btn:hover{background:var(--panel-2);}

.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--primary-soft);border-color:var(--primary);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}

.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:100;}
.modal{background:#fff;border-radius:12px;width:100%;max-width:520px;box-shadow:0 20px 50px rgba(0,0,0,.25);}
.modal.wide{max-width:820px;}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-b{padding:20px;max-height:70vh;overflow-y:auto;}
.modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}

.filters{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px;background:var(--panel-2);border-bottom:1px solid var(--border);}
.filters select,.filters input{padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:#fff;font-size:12.5px;}
.empty{padding:40px 20px;text-align:center;color:var(--text-mute);}
.toast-wrap{position:fixed;top:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--dark);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);animation:slidein .18s ease;}
.toast.err{background:#991b1b;} .toast.ok{background:#166534;}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ---------- Login ---------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 20%,var(--primary-dark),var(--dark-2) 60%);padding:20px;}
.auth-card{background:#fff;border-radius:16px;padding:34px 32px;width:100%;max-width:380px;box-shadow:0 30px 60px rgba(0,0,0,.35);}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.auth-logo .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(310deg,var(--dark),var(--primary));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:16px;}
.auth-logo b{font-size:19px;}
.auth-logo span{display:block;font-size:11.5px;color:var(--text-mute);}
.auth-demo{background:var(--panel-2);border:1px dashed var(--border);border-radius:8px;padding:10px 12px;font-size:11.5px;color:var(--text-soft);margin-top:14px;}
.auth-demo b{color:var(--text);}
.auth-links{display:flex;justify-content:space-between;margin-top:14px;font-size:12.5px;}
.errbox{background:var(--danger-soft);color:#991b1b;padding:9px 12px;border-radius:8px;font-size:12.5px;margin-bottom:12px;}

/* ---------- Tracking (público) ---------- */
.track-wrap{min-height:100vh;background:linear-gradient(180deg,#0f172a,#1e3a8a);padding:30px 16px;}
.track-shell{max-width:460px;margin:0 auto;}
.track-shell .auth-card{margin-bottom:16px;}
.progress-track{position:relative;padding-left:26px;margin:18px 0;}
.p-step{position:relative;padding-bottom:22px;}
.p-step:last-child{padding-bottom:0;}
.p-step::before{content:'';position:absolute;left:-20px;top:20px;bottom:-2px;width:2px;background:var(--border);}
.p-step:last-child::before{display:none;}
.p-dot{position:absolute;left:-26px;top:2px;width:14px;height:14px;border-radius:50%;background:#cbd5e1;border:3px solid #fff;box-shadow:0 0 0 2px #cbd5e1;}
.p-step.done .p-dot{background:var(--success);box-shadow:0 0 0 2px var(--success);}
.p-step.current .p-dot{background:var(--primary);box-shadow:0 0 0 4px var(--primary-soft);}
.trackmap{height:150px;border-radius:10px;background:linear-gradient(135deg,#e0f2fe,#eef2ff);position:relative;overflow:hidden;border:1px solid var(--border);}
.eta-box{display:flex;align-items:center;justify-content:space-between;background:var(--primary-soft);border-radius:10px;padding:12px 14px;margin-top:10px;}
.eta-box b{font-size:20px;color:var(--primary-dark);}

/* ---------- Chofer (móvil) ---------- */
.chofer-shell{min-height:100vh;background:var(--panel-2);}
.chofer-top{background:var(--bg-soft);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;}
.chofer-top b{font-size:15px;}
.chofer-top span{font-size:11.5px;color:#94a3b8;}
.chofer-body{padding:14px;max-width:520px;margin:0 auto;padding-bottom:60px;}
.stop-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
.stop-card.current{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
.stop-num{width:26px;height:26px;border-radius:50%;background:var(--panel-2);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;margin-right:8px;}
.stop-card.current .stop-num{background:var(--primary);color:#fff;border-color:var(--primary);}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px;}
.thumb{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px solid var(--border);}
.thumb img{width:100%;height:100%;object-fit:cover;}
.thumb .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;}
.sigpad{border:1px dashed var(--border);border-radius:8px;background:#fff;touch-action:none;width:100%;height:150px;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:10px 14px;display:flex;gap:8px;max-width:520px;margin:0 auto;}

.mapcanvas{width:100%;height:380px;border-radius:10px;background:#f1f5f9;border:1px solid var(--border);overflow:hidden;}
.map-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-mute);font-size:13px;}
.leaflet-popup-content{font-family:var(--font);font-size:12.5px;}
/* Leaflet usa z-index internos de hasta 1000 (controles) que, sin esto, se escapan
   por encima de cualquier overlay de la página (modales, etc.) porque .leaflet-container
   no crea su propio contexto de apilamiento. Lo forzamos aquí para contenerlos. */
.leaflet-container{z-index:0;}
.legend{display:flex;flex-wrap:wrap;gap:10px;padding:10px 18px;font-size:12px;border-top:1px solid var(--border);}
.legend .li{display:flex;align-items:center;gap:6px;}
.legend .sw{width:12px;height:4px;border-radius:2px;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--text-soft);border-bottom:2px solid transparent;}
.tab.active{color:var(--primary);border-color:var(--primary);}

/* ---------- Indicadores (dashboard) ---------- */
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;}
.seg button{border:none;background:transparent;padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--text-soft);}
.seg button.on{background:linear-gradient(310deg,var(--dark),var(--dark-2));color:#fff;}
.dash-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
.dash-bar select,.dash-bar input{padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:12.5px;}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);min-width:0;}
.kpi h4{font-size:11px;color:var(--text-soft);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin:0;line-height:1.3;}
.kpi .v{font-size:23px;font-weight:800;margin-top:3px;line-height:1.15;color:var(--text);}
.kpi .v small{font-size:12px;font-weight:600;color:var(--text-mute);}
.kpi .s{font-size:11.5px;color:var(--text-mute);margin-top:2px;}
.kpi .meter{height:5px;border-radius:99px;background:var(--border);overflow:hidden;margin-top:7px;}
.kpi .meter i{display:block;height:100%;border-radius:99px;background:var(--ch-1);}
.kpi.good .v{color:#0a7a45;} .kpi.warn .v{color:#b3541e;} .kpi.bad .v{color:#b3261e;}
.sec-t{display:flex;align-items:center;gap:8px;margin:20px 2px 10px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-soft);}
.sec-t::after{content:'';flex:1;height:1px;background:var(--border);}
:root{--ch-1:#2a78d6;--ch-2:#eb6834;--ch-3:#c3c2b7;--ch-grid:#e9ecef;}
.chart{display:flex;align-items:flex-end;gap:2px;height:150px;padding-top:6px;border-bottom:1px solid #c9ced6;}
.chart .col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;cursor:default;}
.chart .col:hover{background:rgba(52,71,103,.06);}
.chart .col i{display:block;width:100%;max-width:34px;margin:0 auto;min-height:0;}
.chart .col i:first-child{border-radius:4px 4px 0 0;}
.chart-x{display:flex;gap:2px;margin-top:4px;}
.chart-x span{flex:1;min-width:0;text-align:center;font-size:10px;color:var(--text-mute);white-space:nowrap;overflow:hidden;}
.ch-leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text-soft);}
.ch-leg span{display:inline-flex;align-items:center;gap:6px;}
.ch-leg i{width:10px;height:10px;border-radius:3px;display:inline-block;}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 54px;gap:8px;align-items:center;font-size:12.5px;padding:5px 0;}
.hbar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
.hbar .b{height:12px;background:var(--panel-2);border-radius:0 4px 4px 0;overflow:hidden;}
.hbar .b i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--ch-1);}
.hbar .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;}
.alerta{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
.alerta:last-child{border-bottom:none;}
.alerta .ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;background:var(--warning-soft);}
.alerta.crit .ic{background:var(--danger-soft);}
.alerta a{font-weight:600;white-space:nowrap;}
.mini-bar{display:inline-block;width:60px;height:6px;border-radius:99px;background:var(--border);overflow:hidden;vertical-align:middle;margin-right:6px;}
.mini-bar i{display:block;height:100%;background:var(--ch-1);border-radius:99px;}
#tip{position:fixed;z-index:400;pointer-events:none;background:var(--dark-2);color:#fff;font-size:12px;line-height:1.5;padding:7px 10px;border-radius:8px;box-shadow:var(--shadow-lg);max-width:260px;display:none;white-space:pre-line;}
.acciones{display:flex;flex-wrap:wrap;gap:8px;}
.buscador{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:12.5px;min-width:190px;}
.top-search{flex:1;max-width:340px;margin:0 14px;position:relative;}
.top-search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--border);border-radius:10px;background:var(--panel);font-size:13px;}
.top-search::before{content:'🔎';position:absolute;left:10px;top:7px;font-size:12px;opacity:.6;}
th[data-sort]{cursor:pointer;user-select:none;}
th[data-sort]:hover{color:var(--text);}
.venc{font-size:11px;font-weight:700;}
.venc.v-bad{color:#b3261e;} .venc.v-warn{color:#b3541e;}

<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>
<div id="tip"></div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script>
/* ============================================================
   0. CONFIGURACIÓN — ver config.js (compartido con la app del chofer)
   ============================================================ */
const CFG = window.MPR_CONFIG;
const sb = supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);
// Vista previa con datos de ejemplo (demo.js): solo en el equipo local con ?demo en la dirección.
// No lee ni escribe en Supabase; publicado en internet este modo no existe.
const DEMO = /[?&]demo\b/.test(location.search) && ['localhost','127.0.0.1'].includes(location.hostname);

/* ============================================================
   1. UTILIDADES
   ============================================================ */
const Util = {
  uid(p){ return (p||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); },
  // Fecha local (YYYY-MM-DD) de un Date — NO usar toISOString().slice(0,10) para esto:
  // eso da la fecha en UTC, que en México (UTC-6) se adelanta hasta 6h antes de medianoche real.
  dateISO(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; },
  todayISO(){ return Util.dateISO(new Date()); },
  nowISO(){ return new Date().toISOString(); },
  fmtDate(iso){
    if(!iso) return '—';
    // Fechas "solo día" (YYYY-MM-DD) las interpreta el motor JS como UTC medianoche;
    // en zonas horarias negativas (México) eso corre la fecha un día hacia atrás al
    // mostrarla en local. Forzamos medianoche LOCAL para fechas sin hora explícita.
    const d = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? new Date(iso+'T00:00:00') : new Date(iso);
    return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});
  },
  fmtTime(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); },
  fmtDateTime(iso){ if(!iso) return '—'; return Util.fmtDate(iso)+' '+Util.fmtTime(iso); },
  minsBetween(a,b){ return Math.round((new Date(b)-new Date(a))/60000); },
  fmtMins(m){ if(m==null||isNaN(m)) return '—'; const h=Math.floor(m/60), mm=m%60; return h>0 ? `${h}h ${mm}m` : `${mm}m`; },
  toRad(d){ return d*Math.PI/180; },
  toDeg(r){ return r*180/Math.PI; },
  distKm(a,b){
    if(!a||!b||a.lat==null||b.lat==null) return 0;
    const R=6371, dLat=Util.toRad(b.lat-a.lat), dLng=Util.toRad(b.lng-a.lng);
    const x=Math.sin(dLat/2)**2 + Math.cos(Util.toRad(a.lat))*Math.cos(Util.toRad(b.lat))*Math.sin(dLng/2)**2;
    return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
  },
  bearing(a,b){
    const y=Math.sin(Util.toRad(b.lng-a.lng))*Math.cos(Util.toRad(b.lat));
    const x=Math.cos(Util.toRad(a.lat))*Math.sin(Util.toRad(b.lat)) - Math.sin(Util.toRad(a.lat))*Math.cos(Util.toRad(b.lat))*Math.cos(Util.toRad(b.lng-a.lng));
    return (Util.toDeg(Math.atan2(y,x))+360)%360;
  },
  turnDelta(prevBearing,newBearing){
    let d = newBearing - prevBearing;
    while(d>180) d-=360; while(d<-180) d+=360;
    return d; // positivo = giro a la derecha, negativo = giro a la izquierda
  },
  jitter(point,km){
    if(!point||point.lat==null) return point;
    const dLat=(Math.random()-0.5)*2*(km/111);
    const dLng=(Math.random()-0.5)*2*(km/(111*Math.cos(Util.toRad(point.lat))||111));
    return {lat:point.lat+dLat,lng:point.lng+dLng};
  },
  esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  // Limpia una coordenada capturada desde Excel/formulario. Corrige los casos más comunes
  // al pegar "lat, lng" desde Google Maps y separar en dos columnas a mano: comas, comillas
  // o espacios sobrantes al inicio/fin (ej. "24.7530,", '-107.6995"'). Sin esto, Number()
  // da NaN y la coordenada "pasa" como válida en checks tipo `!= null` (NaN != null).
  parseCoord(raw){
    if(raw==null || raw==='') return null;
    const cleaned = String(raw).trim().replace(/^[^0-9\-]+/,'').replace(/[^0-9]+$/,'').trim();
    if(cleaned==='' || cleaned==='-') return null;
    const n = Number(cleaned);
    return isNaN(n) ? null : n;
  },
  // Coordenada + rango geográfico válido. Atrapa datos corruptos que SÍ parsean como número
  // pero son imposibles (ej. "-10744389" por un punto decimal perdido al capturar el dato:
  // debía ser "-107.44389") — sin este límite, ese valor rompe el mapa igual que un NaN.
  parseLat(raw){ const n=Util.parseCoord(raw); return (n==null||n<-90||n>90) ? null : n; },
  parseLng(raw){ const n=Util.parseCoord(raw); return (n==null||n<-180||n>180) ? null : n; },
  money(n){ n=Number(n||0); return '$'+n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}); },
  num(n,d){ n=Number(n||0); return n.toLocaleString('es-MX',{maximumFractionDigits:d==null?2:d}); },
  parseCSV(text){
    const rows=[]; let row=[],cell='',inQ=false;
    text=text.replace(/\r\n/g,'\n').replace(/^﻿/,'');
    for(let i=0;i<text.length;i++){
      const c=text[i];
      if(inQ){
        if(c=='"'){ if(text[i+1]=='"'){cell+='"';i++;} else inQ=false; }
        else cell+=c;
      } else {
        if(c=='"') inQ=true;
        else if(c==','){ row.push(cell); cell=''; }
        else if(c=='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
        else cell+=c;
      }
    }
    if(cell.length||row.length){ row.push(cell); rows.push(row); }
    return rows.filter(r=>r.some(c=>String(c).trim()!==''));
  },
  resizeImage(file,maxDim,quality){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=e=>{
        const img=new Image();
        img.onload=()=>{
          let w=img.width,h=img.height;
          if(w>h){ if(w>maxDim){h=h*maxDim/w;w=maxDim;} } else { if(h>maxDim){w=w*maxDim/h;h=maxDim;} }
          const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
          cv.getContext('2d').drawImage(img,0,0,w,h);
          resolve(cv.toDataURL('image/jpeg',quality||0.6));
        };
        img.onerror=reject;
        img.src=e.target.result;
      };
      reader.onerror=reject;
      reader.readAsDataURL(file);
    });
  },
  // Fecha de Excel/CSV a YYYY-MM-DD: acepta número de serie de Excel, dd/mm/aaaa o ISO. Otro formato = null.
  parseFecha(v){
    if(v==null||v==='') return null;
    if(v instanceof Date) return isNaN(v)?null:Util.dateISO(v);
    if(typeof v==='number' || /^\d{4,6}(\.\d+)?$/.test(String(v).trim())){
      const d=new Date(Date.UTC(1899,11,30)+Math.floor(Number(v))*86400000);
      return isNaN(d)?null:d.toISOString().slice(0,10);
    }
    const t=String(v).trim(); let m;
    if((m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
    if((m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))) return `${m[3].length===2?'20'+m[3]:m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    return null;
  },
  parseNum(v){ if(v==null||v==='') return null; const n=Number(String(v).replace(/[$,\s]/g,'')); return isNaN(n)?null:n; },
  descargarCSV(nombre, filas){
    const csv = filas.map(f=>f.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
    a.download=nombre; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  },
  hace(iso){ const m=Util.minsBetween(iso,Util.nowISO()); return m<1?'hace un momento':m<60?`hace ${m} min`:`hace ${Util.fmtMins(m)}`; },
  pct(a,b){ return b ? Math.round(a/b*100) : null; },
  pctTxt(a,b){ const p=Util.pct(a,b); return p==null?'—':p+'%'; },
  prom(arr){ return arr.length ? arr.reduce((s,x)=>s+x,0)/arr.length : null; },
  suma(arr,fn){ return arr.reduce((s,x)=>s+(Number(fn(x))||0),0); },
  // Días que faltan para una fecha YYYY-MM-DD (negativo = ya venció); null si no hay fecha.
  diasPara(fecha){ if(!fecha) return null; return Math.round((new Date(fecha+'T00:00:00')-new Date(Util.todayISO()+'T00:00:00'))/86400000); },
  vence(fecha){
    const d=Util.diasPara(fecha); if(d==null) return '';
    if(d<0) return `<div class="venc v-bad">Venció ${Util.fmtDate(fecha)}</div>`;
    if(d<=30) return `<div class="venc v-warn">Vence en ${d} día(s)</div>`;
    return `<div class="small mute2">Vence ${Util.fmtDate(fecha)}</div>`;
  },
  // Texto de búsqueda sin acentos ni mayúsculas
  norm(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); },
  coincide(q, ...campos){ q=Util.norm(q).trim(); return !q || campos.some(c=>Util.norm(c).includes(q)); },
  toast(msg,type){
    const wrap=document.getElementById('toastWrap');
    const el=document.createElement('div');
    el.className='toast'+(type?' '+type:'');
    el.textContent=msg;
    wrap.appendChild(el);
    setTimeout(()=>el.remove(),3200);
  }
};

/* ============================================================
   2. CAPA DE DATOS (Supabase, tablas con sufijo _mpr)
   Las vistas siguen leyendo de forma síncrona: DB mantiene una copia
   en memoria de lo que el usuario puede ver (RLS decide el alcance por
   rol) y cada escritura se aplica al instante en esa copia y se envía a
   Supabase en segundo plano, en orden. Si Supabase la rechaza, se avisa
   y se vuelve a cargar lo real.
   En la app los campos van en camelCase; en Postgres en snake_case.
   ============================================================ */
const DB = {
  _c:{}, _q:Promise.resolve(), _desde:null, _canal:null,
  CATALOGOS:['sociedades','centros','unidades','choferes','tiendas','usuarios'],
  DIAS_VENTANA:35, // rutas/pedidos/entregas que se cargan al entrar (el Histórico pide más si hace falta)
  _t(t){ return t+'_mpr'; },
  toRow(o){
    const r={};
    Object.keys(o).forEach(k=>{
      if(k[0]==='_' || o[k]===undefined) return;
      r[k.replace(/[A-Z]/g,m=>'_'+m.toLowerCase())] = o[k]==='' ? null : o[k];
    });
    return r;
  },
  fromRow(r){ const o={}; Object.keys(r).forEach(k=>{ o[k.replace(/_([a-z0-9])/g,(m,c)=>c.toUpperCase())]=r[k]; }); return o; },

  get(t){ return this._c[t] || (this._c[t]=[]); },
  // Búsqueda por id con índice (los tableros recorren miles de pedidos; un .find() por cada uno
  // se vuelve lento). El índice se rehace solo cuando la tabla cambió.
  _ix:{},
  find(t,id){
    if(id==null) return undefined;
    const arr=this.get(t); let ix=this._ix[t];
    if(!ix || ix.arr!==arr || ix.n!==arr.length){ ix=this._ix[t]={arr, n:arr.length, m:new Map(arr.map(x=>[x.id,x]))}; }
    return ix.m.get(id);
  },
  query(t,fn){ return this.get(t).filter(fn); },

  // Lee una tabla completa por páginas (PostgREST entrega máximo 1000 renglones por petición).
  async _all(t, filtro){
    let out=[], desde=0;
    for(;;){
      let q = sb.from(this._t(t)).select('*').order('created_at').order('id').range(desde, desde+999);
      if(filtro) q = filtro(q);
      const {data,error} = await q;
      if(error) throw error;
      out = out.concat(data);
      if(data.length<1000) break;
      desde += 1000;
    }
    return out.map(this.fromRow);
  },
  async reload(t){ this._c[t] = await this._all(t); },
  async load(desdeISO){
    const desde = desdeISO || Util.dateISO(new Date(Date.now()-this.DIAS_VENTANA*86400000));
    if(DEMO){ this._desde = this._desde && this._desde<desde ? this._desde : desde; return; }
    const [cats, rutas, pedidos, entregas, incidencias] = await Promise.all([
      Promise.all(this.CATALOGOS.map(t=>this._all(t))),
      this._all('rutas', q=>q.gte('fecha',desde)),
      this._all('pedidos', q=>q.gte('fecha',desde)),
      this._all('entregas', q=>q.gte('hora_entrega',desde+'T00:00:00')),
      // Tabla de la ampliación v2: si la base aún no la tiene, el panel sigue funcionando sin ella.
      this._all('incidencias', q=>q.gte('hora',desde+'T00:00:00')).catch(()=>[]),
    ]);
    this.CATALOGOS.forEach((t,i)=>{ this._c[t]=cats[i]; });
    this._c.rutas=rutas; this._c.pedidos=pedidos; this._c.entregas=entregas; this._c.incidencias=incidencias;
    this._desde=desde;
  },
  clear(){ this._c={}; this._ix={}; this._desde=null; if(this._canal){ sb.removeChannel(this._canal); this._canal=null; } },

  _w(fn){
    if(DEMO) return this._q; // vista previa: los cambios solo viven en memoria
    this._q = this._q.then(fn).then(res=>{ if(res && res.error) throw res.error; }).catch(err=>{
      console.error(err);
      const msg = /row-level security|permission denied/i.test(err.message||'') ? 'tu rol no permite ese cambio' : (err.message||err);
      Util.toast('No se pudo guardar: '+msg,'err');
      this.load(this._desde).then(()=>route()).catch(()=>{});
    });
    return this._q;
  },
  insert(t,obj){
    obj.id = obj.id || crypto.randomUUID();
    obj.createdAt = obj.createdAt || Util.nowISO();
    this.get(t).push(obj);
    this._w(()=>sb.from(this._t(t)).insert(this.toRow(obj)));
    return obj;
  },
  insertMany(t,arr){
    if(!arr.length) return;
    arr.forEach(o=>{ o.id=o.id||crypto.randomUUID(); o.createdAt=o.createdAt||Util.nowISO(); this.get(t).push(o); });
    for(let i=0;i<arr.length;i+=500){
      const lote = arr.slice(i,i+500).map(o=>this.toRow(o));
      this._w(()=>sb.from(this._t(t)).insert(lote));
    }
  },
  update(t,id,patch){
    const all=this.get(t); const i=all.findIndex(x=>x.id===id);
    if(i<0) return null;
    all[i]=Object.assign({},all[i],patch); this._ix[t]=null;
    this._w(()=>sb.from(this._t(t)).update(this.toRow(patch)).eq('id',id));
    return all[i];
  },
  remove(t,id){
    this._c[t]=this.get(t).filter(x=>x.id!==id);
    this._w(()=>sb.from(this._t(t)).delete().eq('id',id));
  },

  /* Realtime: avances de los choferes y posiciones GPS llegan solos al panel. */
  subscribe(){
    if(this._canal || DEMO) return;
    const ch = sb.channel('mpr-panel');
    ['rutas','pedidos','entregas','ubicaciones','incidencias'].forEach(t=>{
      ch.on('postgres_changes',{event:'*',schema:'public',table:this._t(t)}, p=>this._rt(t,p));
    });
    this._canal = ch.subscribe();
  },
  _rt(t,p){
    if(t==='ubicaciones'){
      if(p.eventType==='INSERT') Ubic.agregar(this.fromRow(p.new));
    } else if(p.eventType==='DELETE'){
      this._c[t]=this.get(t).filter(x=>x.id!==p.old.id);
    } else {
      const o=this.fromRow(p.new), all=this.get(t), i=all.findIndex(x=>x.id===o.id);
      if(i>-1) all[i]=Object.assign({},all[i],o); else all.push(o);
      this._ix[t]=null;
      if(t==='incidencias' && p.eventType==='INSERT') Util.toast('⚠️ Incidencia en ruta: '+(TIPOS_INCIDENCIA[o.tipo]||o.tipo),'err');
    }
    clearTimeout(this._rtTimer);
    this._rtTimer=setTimeout(()=>window.dispatchEvent(new Event('mpr:datos')),700);
  }
};

/* Recorrido real (GPS) de cada ruta. Se pide solo para las rutas que el mapa
   está mostrando y se queda en memoria; lo nuevo llega por Realtime. */
const Ubic = {
  porRuta:{}, _cargadas:new Set(),
  de(rutaId){ return this.porRuta[rutaId] || []; },
  agregar(u){
    const arr = this.porRuta[u.rutaId] || (this.porRuta[u.rutaId]=[]);
    if(arr.some(x=>x.id===u.id)) return;
    arr.push(u); arr.sort((a,b)=>new Date(a.registradaEn)-new Date(b.registradaEn));
  },
  // Devuelve true si trajo algo nuevo (para redibujar el mapa).
  async cargar(rutaIds){
    const faltan = rutaIds.filter(id=>!this._cargadas.has(id));
    if(!faltan.length || DEMO) return false;
    faltan.forEach(id=>this._cargadas.add(id));
    try{
      const filas = await DB._all('ubicaciones', q=>q.in('ruta_id',faltan));
      filas.forEach(u=>this.agregar(u));
      return filas.length>0;
    }catch(e){ faltan.forEach(id=>this._cargadas.delete(id)); console.error(e); return false; }
  },
  clear(){ this.porRuta={}; this._cargadas=new Set(); }
};

/* ============================================================
   3. ALGORITMO DE OPTIMIZACIÓN DE RUTA
   Heurística de vecino más cercano con penalización a giros a la
   derecha (inspirado en el enfoque de Amazon de preferir giros a
   la izquierda / continuar de frente para reducir tiempos muertos
   en cruces). No usa red vial real: aproxima con línea recta +
   ángulo de rumbo entre paradas consecutivas.
   ============================================================ */
function optimizarRuta(depot, paradas){
  const pend = paradas.slice();
  const orden = [];
  let actual = (depot && depot.lat!=null && depot.lng!=null) ? {lat:depot.lat,lng:depot.lng} : (pend[0]||{lat:0,lng:0});
  let rumboPrev = null;
  const PENALTY = 0.35; // peso de la penalización por giro a la derecha
  while(pend.length){
    let bestIdx=0, bestCost=Infinity;
    for(let i=0;i<pend.length;i++){
      const cand=pend[i];
      const d=Util.distKm(actual,cand);
      let cost=d;
      if(rumboPrev!=null && d>0){
        const rumboNuevo=Util.bearing(actual,cand);
        const delta=Util.turnDelta(rumboPrev,rumboNuevo);
        if(delta>0) cost = d * (1 + PENALTY*(delta/180)); // giro a la derecha: penaliza
        else cost = d * (1 + (PENALTY*0.15)*(Math.abs(delta)/180)); // giro a la izquierda: casi sin penalización
      }
      if(cost<bestCost){ bestCost=cost; bestIdx=i; }
    }
    const elegido=pend.splice(bestIdx,1)[0];
    if(actual && (actual.lat!==elegido.lat || actual.lng!==elegido.lng)){
      rumboPrev = Util.bearing(actual, elegido);
    }
    actual=elegido;
    orden.push(elegido);
  }
  return orden;
}

/* ============================================================
   4. SESIÓN / AUTENTICACIÓN (Supabase Auth + usuarios_mpr)
   La cuenta vive en Supabase Auth; el rol y el alcance (sociedad,
   centro o chofer) en usuarios_mpr. Una cuenta de Auth sin renglón
   activo en usuarios_mpr no entra a MapRoad.
   ============================================================ */
const ROLES = {
  admin:{label:'Administrador', desc:'Ve y edita todo; crea usuarios'},
  sociedad:{label:'Por sociedad', desc:'Ve y edita los centros de su razón social'},
  centro:{label:'Por centro', desc:'Ve y edita solo su centro / CEDIS'},
  chofer:{label:'Chofer', desc:'Solo la app móvil con su ruta del día'},
  auditor:{label:'Observador de auditoría', desc:'Consulta todo y la bitácora; no edita'},
};
const Auth = {
  user:null,
  async _perfil(uid){
    const {data} = await sb.from('usuarios_mpr').select('*').eq('id',uid).maybeSingle();
    this.user = (data && data.activo) ? DB.fromRow(data) : null;
    return this.user;
  },
  async init(){
    const {data:{session}} = await sb.auth.getSession();
    if(session) await this._perfil(session.user.id);
    return this.user;
  },
  // Acepta correo completo o solo el usuario (prueba el dominio interno y el corporativo).
  async login(usuario,password){
    const u = String(usuario||'').trim().toLowerCase();
    const correos = u.includes('@') ? [u] : [u+'@'+CFG.dominioInterno, u+'@'+CFG.dominioCorporativo];
    for(const email of correos){
      const {data,error} = await sb.auth.signInWithPassword({email,password});
      if(error || !data.user) continue;
      if(await this._perfil(data.user.id)) return {user:this.user};
      await sb.auth.signOut();
      return {error:'Tu cuenta no tiene acceso a MapRoad. Pide al administrador que te dé de alta.'};
    }
    return {error:'Usuario o contraseña incorrectos.'};
  },
  async logout(){ await sb.auth.signOut(); this.user=null; DB.clear(); Ubic.clear(); },
  current(){ return this.user; }
};

function currentPath(){ return (location.hash||'#/login').replace('#/','').split('?')[0] || 'login'; }
function hashParam(name){ const q=(location.hash||'').split('?')[1]; return q ? new URLSearchParams(q).get(name) : null; }

let _liveRefresh = null; // la vista activa registra aquí cómo refrescarse sin redibujarse completa
let _listo = false;      // true cuando ya se resolvió la sesión y se cargaron los datos

function route(){
  if(!_listo) return;
  const user = Auth.current();
  const path = currentPath();
  _liveRefresh = null;

  if(path==='tracking'){ return renderTracking(); }
  if(!user){ if(path!=='login') location.hash='#/login'; return renderLogin(); }

  // Los choferes no usan el panel: su app (la misma que va en el APK) vive en /chofer/
  if(user.rol==='chofer'){ location.replace('chofer/'); return; }

  if(path==='login'){ location.hash = '#/dashboard'; return; }
  const allowed = NAV_ITEMS.flatMap(g=>g.items).filter(i=>i.roles.includes(user.rol)).map(i=>i.path);
  const validPath = allowed.includes(path) ? path : 'dashboard';
  if(validPath!==path){ location.hash='#/'+validPath; return; }
  renderAdminShell(user, validPath);
}
window.addEventListener('hashchange', route);
window.addEventListener('mpr:datos', ()=>{
  if(document.querySelector('.modal-bg')) return; // no interrumpir a quien está capturando
  if(_liveRefresh) _liveRefresh();
  else if(currentPath()==='dashboard') route();
});

function renderLogin(){
  const app=document.getElementById('app');
  document.body.classList.remove('solo-lectura');
  app.innerHTML = `
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo">MR</div>
        <div><b>MapRoad</b><span>Control de unidades, rutas y entregas</span></div>
      </div>
      <div id="loginErr"></div>
      <form id="loginForm">
        <div class="field"><label>Usuario o correo</label><input name="usuario" autocomplete="username" autocapitalize="none" required></div>
        <div class="field"><label>Contraseña</label><input type="password" name="password" autocomplete="current-password" required></div>
        <button class="btn primary block" type="submit" id="loginBtn">Iniciar sesión</button>
      </form>
      <div class="auth-links">
        <a href="#/tracking">📦 Rastrear un pedido</a>
        <a href="${Util.esc(CFG.apkUrl)}" download>📱 App del chofer (Android)</a>
      </div>
    </div>
  </div>`;
  document.getElementById('loginForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const f=new FormData(e.target), btn=document.getElementById('loginBtn');
    btn.disabled=true; btn.textContent='Entrando…';
    const r = await Auth.login(f.get('usuario'), f.get('password'));
    if(r.error){
      btn.disabled=false; btn.textContent='Iniciar sesión';
      document.getElementById('loginErr').innerHTML=`<div class="errbox">${Util.esc(r.error)}</div>`;
      return;
    }
    if(r.user.rol==='chofer'){ location.replace('chofer/'); return; }
    try{ await DB.load(); DB.subscribe(); }
    catch(err){ console.error(err); Util.toast('No se pudieron cargar los datos: '+(err.message||err),'err'); }
    location.hash='#/dashboard';
    route();
  });
}

/* Búsqueda rápida desde cualquier pantalla: abre el informe del folio. Si no está en lo ya
   cargado (más antiguo que la ventana inicial), lo pide a Supabase. */
async function buscarFolioGlobal(folio){
  const f=folio.toLowerCase();
  let hay = DB.get('pedidos').some(p=>p.folio && p.folio.toLowerCase()===f);
  if(!hay && !DEMO){
    const {data} = await sb.from('pedidos_mpr').select('*').ilike('folio', folio).order('created_at',{ascending:false}).limit(5);
    for(const row of (data||[])){
      const p=DB.fromRow(row);
      if(!DB.find('pedidos',p.id)) DB.get('pedidos').push(p);
      if(p.rutaId && !DB.find('rutas',p.rutaId)){
        const [r,e] = await Promise.all([sb.from('rutas_mpr').select('*').eq('id',p.rutaId).maybeSingle(), sb.from('entregas_mpr').select('*').eq('pedido_id',p.id)]);
        if(r.data) DB.get('rutas').push(DB.fromRow(r.data));
        (e.data||[]).forEach(x=>{ if(!DB.find('entregas',x.id)) DB.get('entregas').push(DB.fromRow(x)); });
      }
      hay=true;
    }
  }
  if(!hay){
    // Coincidencia parcial: se manda al histórico con el filtro puesto
    const parcial = DB.get('pedidos').filter(p=>p.folio && p.folio.toLowerCase().includes(f));
    if(parcial.length===1) return openInformeFolioModal(parcial[0].folio);
    Util.toast(parcial.length?`${parcial.length} folios contienen "${folio}": escribe el folio completo`:'No se encontró ningún pedido con ese folio','err');
    return;
  }
  openInformeFolioModal(folio);
}

/* Tooltip compartido: cualquier elemento con data-tip lo muestra al pasar el cursor. */
(function(){
  const tip=document.getElementById('tip');
  document.addEventListener('mousemove', e=>{
    const t=e.target.closest && e.target.closest('[data-tip]');
    if(!t){ tip.style.display='none'; return; }
    tip.textContent=t.dataset.tip; tip.style.display='block';
    const w=tip.offsetWidth, h=tip.offsetHeight;
    tip.style.left=Math.min(window.innerWidth-w-8, e.clientX+14)+'px';
    tip.style.top=(e.clientY+h+24>window.innerHeight ? e.clientY-h-10 : e.clientY+16)+'px';
  });
})();

/* Filtro de texto para las tablas de catálogos: oculta los renglones que no coinciden. */
function activarBuscador(el, inputSel, tbodySel){
  const inp=el.querySelector(inputSel); if(!inp) return;
  inp.oninput=()=>{

const TIPOS_INCIDENCIA = {falla_mecanica:'Falla mecánica', llanta:'Llanta ponchada', trafico:'Tráfico / bloqueo', accidente:'Accidente',
  clima:'Clima', inseguridad:'Inseguridad', mercancia:'Mercancía dañada', otro:'Otro'};
const ESTATUS_TXT = {pendiente:'Pendiente', entregado:'Entregado', cliente_ausente:'Cliente ausente', reprogramado:'Reprogramado',
  cancelado_sucursal:'Recoge en sucursal', fallido:'No entregado (otro motivo)'};
const METROS_FUERA = 300;  // una entrega cerrada a más de esta distancia del domicilio se marca "fuera de punto"
const DIAS_REPROGRAMAR = 14; // un no entregado más viejo que esto ya no se ofrece para reprogramar
const MIN_SIN_SENAL = 12;  // minutos sin reporte GPS para considerar una unidad sin señal

/* Km reales de una ruta: odómetro capturado por el chofer si existe; si no, lo acumulado por GPS. */
function kmRealRuta(r){
  if(r.odometroInicio!=null && r.odometroFin!=null && Number(r.odometroFin)>Number(r.odometroInicio)) return Number(r.odometroFin)-Number(r.odometroInicio);
  return Number(r.kmGps)>0 ? Number(r.kmGps) : null;
}
/* Km en línea recta de un recorrido salida → paradas → regreso (estimación del plan). */
function kmDeSecuencia(origen, paradas){
  const seq = [origen, ...paradas, origen].filter(p=>p && p.lat!=null && p.lng!=null);
  let km=0; for(let i=1;i<seq.length;i++) km+=Util.distKm(seq[i-1],seq[i]);
  return Math.round(km*10)/10;
}
/* Pedidos no entregados que nadie ha vuelto a programar (cada reintento apunta a su intento anterior). */
function pedidosPorReprogramar(centroId){
  const ya = new Set(DB.get('pedidos').map(p=>p.reintentoDe).filter(Boolean));
  const desde = Util.dateISO(new Date(Date.now()-DIAS_REPROGRAMAR*86400000));
  return DB.query('pedidos', p=>['cliente_ausente','reprogramado','fallido'].includes(p.estatus) && !ya.has(p.id) && (p.fecha||'')>=desde && (!centroId||p.centroId===centroId));
}
function rutaSinSenal(r){ return r.estatus==='en_curso' && (!r.ultimaUbicacion || Util.minsBetween(r.ultimaUbicacion,Util.nowISO())>MIN_SIN_SENAL); }

/* Todos los indicadores del tablero para un periodo y (opcional) un centro. */
function calcIndicadores(f){
  const hoy=Util.todayISO();
  const enC = x=>!f.centroId || x.centroId===f.centroId;
  const rutas = DB.query('rutas', r=>r.fecha>=f.desde && r.fecha<=f.hasta && enC(r));
  const rutaIds = new Set(rutas.map(r=>r.id));
  const pedidos = DB.query('pedidos', p=>rutaIds.has(p.rutaId));
  const entregas = DB.query('entregas', e=>rutaIds.has(e.rutaId));
  const entDe = new Map(); entregas.forEach(e=>{ const x=entDe.get(e.pedidoId); if(!x||e.horaEntrega>x.horaEntrega) entDe.set(e.pedidoId,e); });
  const incid = DB.query('incidencias', i=>rutaIds.has(i.rutaId));
  const unidades = DB.query('unidades', enC), choferes = DB.query('choferes', enC);

  const ent = pedidos.filter(p=>p.estatus==='entregado');
  const noEx = pedidos.filter(p=>ESTATUS_NO_EXITOSOS.includes(p.estatus));
  const pend = pedidos.filter(p=>!esEstatusCerrado(p.estatus));
  const entOk = ent.map(p=>entDe.get(p.id)).filter(Boolean);
  const conVentana = ent.filter(p=>p.fechaMax && entDe.get(p.id));
  const aTiempo = conVentana.filter(p=>Util.dateISO(new Date(entDe.get(p.id).horaEntrega))<=p.fechaMax);
  const enSitio = pedidos.map(p=>{ const e=entDe.get(p.id); return p.horaLlegada&&e ? Util.minsBetween(p.horaLlegada,e.horaEntrega) : null; }).filter(m=>m!=null && m>=0 && m<600);
  const concl = rutas.filter(r=>r.estatus==='concluida' && r.horaInicio && r.horaFin);
  const durs = concl.map(r=>Util.minsBetween(r.horaInicio,r.horaFin));
  const salidas = rutas.filter(r=>r.horaInicio).map(r=>{ const d=new Date(r.horaInicio); return d.getHours()*60+d.getMinutes(); });
  const kmReales = rutas.map(kmRealRuta).filter(k=>k!=null);
  const pedidosDe = r=>r.pedidoIds.map(id=>DB.find('pedidos',id)).filter(Boolean);
  const ocup = rutas.map(r=>{ const u=DB.find('unidades',r.unidadId); if(!u) return null; const ps=pedidosDe(r);
    return {r,u,kg:Util.suma(ps,p=>p.pesoKg),m3:Util.suma(ps,p=>p.volumenM3)}; }).filter(Boolean);
  const notif = {env:0, fall:0, omi:0};
  rutas.forEach(r=>{ const n=r.notificacionInicio; if(!n) return; notif.env+=(n.enviados||[]).length; notif.fall+=(n.fallidos||[]).length; notif.omi+=(n.omitidos||[]).length; });
  const docs = [];
  choferes.filter(c=>c.estatus!=='inactivo').forEach(c=>{ const d=Util.diasPara(c.licenciaVence); if(d!=null&&d<=30) docs.push({txt:`Licencia de ${c.nombre}`, d, ir:'choferes'}); });
  unidades.forEach(u=>{
    const a=Util.diasPara(u.seguroVence); if(a!=null&&a<=30) docs.push({txt:`Seguro de ${u.placa}`, d:a, ir:'unidades'});
    const b=Util.diasPara(u.verificacionVence); if(b!=null&&b<=30) docs.push({txt:`Verificación de ${u.placa}`, d:b, ir:'unidades'});
  });

  // Series
  const dias=[]; { let d=new Date(f.desde+'T00:00:00'); const fin=new Date(f.hasta+'T00:00:00'); let n=0;
    while(d<=fin && n<62){ dias.push({fecha:Util.dateISO(d), ent:0, inc:0, pen:0}); d.setDate(d.getDate()+1); n++; } }
  const diaIx = new Map(dias.map(d=>[d.fecha,d]));
  const fechaRuta = new Map(rutas.map(r=>[r.id,r.fecha]));
  pedidos.forEach(p=>{ const d=diaIx.get(fechaRuta.get(p.rutaId)); if(!d) return;
    if(p.estatus==='entregado') d.ent++; else if(ESTATUS_NO_EXITOSOS.includes(p.estatus)) d.inc++; else d.pen++; });
  const horas = Array.from({length:24},()=>0);
  entregas.forEach(e=>{ horas[new Date(e.horaEntrega).getHours()]++; });
  const motivos = ESTATUS_NO_EXITOSOS.map(k=>({k, t:ESTATUS_TXT[k], n:noEx.filter(p=>p.estatus===k).length})).filter(m=>m.n).sort((a,b)=>b.n-a.n);
  const incTipos = Object.entries(incid.reduce((o,i)=>{ o[i.tipo]=(o[i.tipo]||0)+1; return o; },{})).map(([k,n])=>({t:TIPOS_INCIDENCIA[k]||k, n})).sort((a,b)=>b.n-a.n);

  const agrupa = (clave, nombreDe)=>{
    const g=new Map();
    rutas.forEach(r=>{ const k=r[clave]||''; if(!g.has(k)) g.set(k,{nombre:nombreDe(k), rutas:0, paradas:0, ent:0, inc:0, mins:0, concl:0, paradasConcl:0, sitio:[], km:0});
      const x=g.get(k), ps=pedidosDe(r);
      x.rutas++; x.paradas+=ps.length; x.ent+=ps.filter(p=>p.estatus==='entregado').length; x.inc+=ps.filter(p=>ESTATUS_NO_EXITOSOS.includes(p.estatus)).length;
      if(r.estatus==='concluida'&&r.horaInicio&&r.horaFin){ x.mins+=Util.minsBetween(r.horaInicio,r.horaFin); x.concl++; x.paradasConcl+=r.pedidoIds.length; }
      ps.forEach(p=>{ const e=entDe.get(p.id); if(p.horaLlegada&&e){ const m=Util.minsBetween(p.horaLlegada,e.horaEntrega); if(m>=0&&m<600) x.sitio.push(m); } });
      x.km += kmRealRuta(r)||0;
    });
    return [...g.values()].sort((a,b)=>b.paradas-a.paradas);
  };

  const unidadesEnPeriodo = new Set(rutas.map(r=>r.unidadId).filter(Boolean));
  const choferesEnPeriodo = new Set(rutas.map(r=>r.choferId).filter(Boolean));
  const operables = unidades.filter(u=>u.estatus!=='mantenimiento');
  return {
    rutas, pedidos, entregas, incid, unidades, choferes, dias, horas, motivos, incTipos, docs, notif,
    total:pedidos.length, ent:ent.length, noEx:noEx.length, pend:pend.length, cerrados:ent.length+noEx.length,
    parciales:entregas.filter(e=>e.entregaParcial).length,
    aTiempo:aTiempo.length, conVentana:conVentana.length,
    vencidos:pend.filter(p=>p.fechaMax && p.fechaMax<hoy).length,
    porReprogramar:pedidosPorReprogramar(f.centroId).length,
    reintentos:pedidos.filter(p=>(p.intento||1)>1).length,
    rPend:rutas.filter(r=>r.estatus==='pendiente').length, rCurso:rutas.filter(r=>r.estatus==='en_curso').length, rConcl:rutas.filter(r=>r.estatus==='concluida').length,
    rSinChofer:rutas.filter(r=>!r.choferId && r.estatus==='pendiente').length,
    durProm:Util.prom(durs), minParada: Util.suma(concl,r=>r.pedidoIds.length) ? Util.suma(durs,x=>x)/Util.suma(concl,r=>r.pedidoIds.length) : null,
    sitioProm:Util.prom(enSitio), salidaProm:Util.prom(salidas),
    kmPlan:Util.suma(rutas,r=>r.kmPlan), kmReal:kmReales.reduce((a,b)=>a+b,0), hayKmReal:kmReales.length>0,
    sinSenal:DB.query('rutas', r=>enC(r) && rutaSinSenal(r)).length,
    incAbiertas:DB.query('incidencias', i=>enC(i) && !i.atendida).length,
    uDisp:unidades.filter(u=>u.estatus==='disponible').length, uRuta:unidades.filter(u=>u.estatus==='en_ruta').length, uMant:unidades.filter(u=>u.estatus==='mantenimiento').length,
    utilizacion:Util.pct([...unidadesEnPeriodo].filter(id=>operables.some(u=>u.id===id)).length, operables.length),
    unidadesUsadas:unidadesEnPeriodo.size, operables:operables.length,
    ocKg:Util.prom(ocup.filter(o=>o.u.capacidadKg>0).map(o=>o.kg/o.u.capacidadKg*100)),
    ocM3:Util.prom(ocup.filter(o=>o.u.capacidadM3>0).map(o=>o.m3/o.u.capacidadM3*100)),
    sobrecarga:ocup.filter(o=>(o.u.capacidadKg>0&&o.kg>o.u.capacidadKg)||(o.u.capacidadM3>0&&o.m3>o.u.capacidadM3)).length,
    chActivos:choferes.filter(c=>c.estatus!=='inactivo').length, chConRuta:choferesEnPeriodo.size,
    importe:Util.suma(pedidos,p=>p.importeTotal), importeEnt:Util.suma(ent,p=>p.importeTotal), importeNoEx:Util.suma(noEx,p=>p.importeTotal),
    kg:Util.suma(pedidos,p=>p.pesoKg), kgEnt:Util.suma(ent,p=>p.pesoKg), m3:Util.suma(pedidos,p=>p.volumenM3), m3Ent:Util.suma(ent,p=>p.volumenM3),
    conFoto:entOk.filter(e=>(e.fotos||[]).length).length, conFirma:entOk.filter(e=>e.firma).length, conRecibe:entOk.filter(e=>e.recibeNombre).length,
    entOk:entOk.length, fueraPunto:entOk.filter(e=>e.distanciaM!=null && e.distanciaM>METROS_FUERA).length, conGeo:entOk.filter(e=>e.distanciaM!=null).length,
    sinCoords:pedidos.filter(p=>p.lat==null||p.lng==null).length,
    porChofer:agrupa('choferId', id=>DB.find('choferes',id)?.nombre||'Sin chofer'),
    porCentro:agrupa('centroId', id=>DB.find('centros',id)?.nombre||'Sin centro'),
  };
}

let _dashF = null;

function estatusBadge(estatus){
  const map={
    pendiente:['b-gray','Pendiente'], en_curso:['b-blue','En curso'], concluida:['b-green','Concluida'],
    disponible:['b-green','Disponible'], en_ruta:['b-blue','En ruta'], mantenimiento:['b-amber','Mantenimiento'],
    entregado:['b-green','Entregado'], fallido:['b-red','Fallido'], activo:['b-green','Activo'], inactivo:['b-gray','Inactivo'],
    cliente_ausente:['b-amber','Cliente ausente'], reprogramado:['b-amber','Reprogramado'], cancelado_sucursal:['b-gray','Recoge en sucursal']
  };
  const [cls,label]=map[estatus]||['b-gray',estatus||'—'];
  return `<span class="badge ${cls}">${label}</span>`;
}

/* Acepta "25.6866, -100.3161" pegado de Google Maps en el campo de latitud y lo reparte en los dos. */
function activarPegadoCoords(modal){
  const la=modal.querySelector('[name=lat]'), ln=modal.querySelector('[name=lng]'); if(!la||!ln) return;
  la.addEventListener('paste', e=>{
    const t=(e.clipboardData||window.clipboardData).getData('text'); const m=t.match(/(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)/);
    if(m){ e.preventDefault(); la.value=m[1]; ln.value=m[2]; }
  });
}

/* Altas, cambios y bajas de usuarios pasan por la Edge Function usuarios-mpr
   (valida que quien llama sea admin y opera Supabase Auth del lado del servidor). */
async function apiUsuarios(body){
  if(DEMO) throw new Error('Vista previa: los usuarios no se crean ni se modifican');
  const {data:{session}} = await sb.auth.getSession();
  const r = await fetch(CFG.supabaseUrl+'/functions/v1/usuarios-mpr', {
    method:'POST',
    headers:{'Content-Type':'application/json', apikey:CFG.supabaseKey, Authorization:'Bearer '+(session?session.access_token:'')},
    body:JSON.stringify(body)
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || ('HTTP '+r.status));
  return d;
}

    let q = sb.from('bitacora_mpr').select('*').gte('created_at', new Date(el.querySelector('#bDesde').value+'T00:00:00').toISOString())
      .lt('created_at', hasta.toISOString()).order('created_at',{ascending:false}).limit(500);
    if(el.querySelector('#bTabla').value) q=q.eq('tabla', el.querySelector('#bTabla').value);
    if(el.querySelector('#bOp').value) q=q.eq('operacion', el.querySelector('#bOp').value);
    const {data,error} = await q;
    if(error){ Util.toast(error.message,'err'); return; }
    filas=data;
    el.querySelector('#bBody').innerHTML = filas.length ? filas.map(f=>{
      const [cls,txt]=OPS[f.operacion]||['b-gray',f.operacion];
      return `<tr><td class="small" style="white-space:nowrap">${Util.fmtDateTime(f.created_at)}</td><td>${Util.esc(f.usuario||'app chofer / sistema')}</td>

    if(filas.length===500) Util.toast('Se muestran los 500 movimientos más recientes; acota las fechas para ver el resto');
  }
  el.querySelector('#bBuscar').onclick=buscar;
  el.querySelector('#bCsv').onclick=()=>Util.descargarCSV('MapRoad_bitacora.csv',
    [['Fecha','Usuario','Tabla','Movimiento','Registro','Detalle']].concat(filas.map(f=>[f.created_at,f.usuario||'',NOMBRES[f.tabla]||f.tabla,f.operacion,f.registro_id||'',resumen(f.cambios)])));
  buscar();
}

function readImportFile(file){
  return new Promise((resolve,reject)=>{
    const ext=file.name.split('.').pop().toLowerCase();
    if(ext==='csv'){
      const r=new FileReader();
      r.onload=e=>{
        const rows=Util.parseCSV(e.target.result);
        const headers=rows[0].map(h=>h.trim());
        resolve({rows: rows.slice(1).map(row=>{ const o={}; headers.forEach((h,i)=>o[h]=row[i]); return o; }), detalleRows:[]});
      };
      r.onerror=reject; r.readAsText(file,'UTF-8');
    } else {
      const r=new FileReader();
      r.onload=e=>{
        try{
          const wb=XLSX.read(e.target.result,{type:'array'});
          const sheet=wb.Sheets[wb.SheetNames[0]];
          const json=XLSX.utils.sheet_to_json(sheet,{defval:''});
          const nombreDetalle = wb.SheetNames.find(n=>n.trim().toLowerCase()==='detalle');
          const detalleRows = nombreDetalle ? XLSX.utils.sheet_to_json(wb.Sheets[nombreDetalle],{defval:''}) : [];
          resolve({rows: json, detalleRows});
        }catch(err){ reject(err); }
      };
      r.onerror=reject; r.readAsArrayBuffer(file);
    }
  });
}

function normalizeRow(raw){
  const out={};
  Object.keys(raw).forEach(k=>{
    const key = XLS_MAP[k.trim().toLowerCase()];
    if(key) out[key]=raw[k];
  });
  return out;
}

let _vehiculoAsign = {};
let _choferAsign = {};   // chofer elegido por vehículo (por defecto, el asignado a la unidad)

function procesarImportacion(el, rawRows, detalleRows){
  const rows = rawRows.map(normalizeRow).filter(r=>r.folio);
  // Artículos por folio: preferimos la hoja "Detalle" (Folio de Pedido, Nombre de
  // Item, Cantidad) si el archivo la trae; si no, se agrupan desde la hoja principal
  // (una fila = un artículo, mismo folio repetido = mismo pedido).
  const itemsPorFolioDetalle = {};
  (detalleRows||[]).map(normalizeRow).filter(r=>r.folio).forEach(r=>{
    (itemsPorFolioDetalle[r.folio]=itemsPorFolioDetalle[r.folio]||[]).push({nombre:r.nombreItem, cantidad:Number(r.cantidad)||0});
  });
  const usaHojaDetalle = Object.keys(itemsPorFolioDetalle).length>0;

  const porFolio = {};
  rows.forEach(r=>{
    if(!porFolio[r.folio]) porFolio[r.folio]={...r, items:[]};
    if(!usaHojaDetalle) porFolio[r.folio].items.push({nombre:r.nombreItem, cantidad:Number(r.cantidad)||0, codigo:r.codigoItem});
  });
  if(usaHojaDetalle){
    Object.keys(porFolio).forEach(folio=>{ porFolio[folio].items = itemsPorFolioDetalle[folio] || []; });
  }
  const pedidosNuevos = Object.values(porFolio).map((p,idx)=>({
    _tmpId:idx, folio:p.folio, vehiculo:p.vehiculo, items:p.items, numeroCliente:p.numeroCliente, nombreContacto:p.nombreContacto,
    telefono:p.telefono, emailContacto:p.emailContacto, direccion:p.direccion, colonia:p.colonia, cp:p.cp,
    lat:Util.parseLat(p.lat), lng:Util.parseLng(p.lng), fechaMin:Util.parseFecha(p.fechaMin), fechaMax:Util.parseFecha(p.fechaMax),
    controlDestino:p.controlDestino, oficinaVentas:p.oficinaVentas, sucursalSolicita:p.sucursalSolicita,
    nombreVendedor:p.nombreVendedor, comentarios:p.comentarios, folioFactura:p.folioFactura,
    pesoKg:Util.parseNum(p.pesoKg), volumenM3:Util.parseNum(p.volumenM3), importeTotal:Util.parseNum(p.importeTotal)
  })).map(p=>{ ['folio','vehiculo','numeroCliente','telefono','cp','folioFactura'].forEach(k=>{ if(p[k]!=null) p[k]=String(p[k]).trim(); }); return p; });

  _importState = pedidosNuevos;
  _vehiculoAsign = {}; _choferAsign = {};
  const unidades = DB.get('unidades');
  const limpia = s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  // Coincide por placa o número económico, sin importar guiones, espacios ni mayúsculas. El texto del
  // archivo se unifica a la placa registrada para que una misma unidad escrita de dos formas no genere dos rutas.
  const unidadDe = v=>unidades.find(u=>limpia(u.placa)===limpia(v) || (u.numeroEconomico && limpia(u.numeroEconomico)===limpia(v)));
  pedidosNuevos.forEach(p=>{ const u=p.vehiculo && unidadDe(p.vehiculo); if(u) p.vehiculo=u.placa; });
  [...new Set(pedidosNuevos.map(p=>p.vehiculo).filter(Boolean))].forEach(v=>{
    const match = unidadDe(v);
    _vehiculoAsign[v] = match ? match.id : '';
    _choferAsign[v] = match && match.choferId ? match.choferId : '';
  });
  const sinVehiculo = pedidosNuevos.filter(p=>!p.vehiculo).length;
  if(sinVehiculo) Util.toast(`${sinVehiculo} pedido(s) no traen vehículo: corrígelos en la lista para poder enrutarlos`,'err');

  renderImportPreview(el);
}

let _omitirDup = true;
/* Folios del archivo que ya existen en una ruta de esa misma fecha (carga repetida). */
function foliosDuplicados(fecha){
  const ya = new Set(DB.query('pedidos', p=>p.fecha===fecha && p.folio).map(p=>p.folio.toLowerCase()));
  return new Set((_importState||[]).filter(p=>ya.has(String(p.folio).toLowerCase())).map(p=>p.folio));
}

    <div class="field-row"><div class="field"><label>Vehículo</label><input name="vehiculo" value="${Util.esc(p.vehiculo||'')}"></div>

    <div class="field"><label>C.P.</label><input name="cp" value="${Util.esc(p.cp||'')}"></div></div>
    <div class="field-row"><div class="field"><label>Teléfono</label><input name="telefono" value="${Util.esc(p.telefono||'')}"></div>

  `, (data)=>{

    if(p.vehiculo!==vehiculoAnterior && !(p.vehiculo in _vehiculoAsign)){
      const un = DB.get('unidades').find(u=>u.placa.toLowerCase()===String(p.vehiculo).toLowerCase());

function generarRutas(el){
  const fecha = document.getElementById('fFecha').value || Util.todayISO();
  const centroId = document.getElementById('fCentro').value;
  const origenTiendaId = document.getElementById('fTiendaOrigen').value;
  const origenTienda = DB.find('tiendas', origenTiendaId);
  if(!origenTienda){ Util.toast('Selecciona la tienda de origen antes de generar','err'); return; }
  if(!centroId){ Util.toast('Selecciona el centro de la ruta','err'); return; }
  const unidades = DB.get('unidades'), choferes = DB.get('choferes');
  const dups = _omitirDup ? foliosDuplicados(fecha) : new Set();

  const porVehiculo = {};
  _importState.filter(p=>!dups.has(p.folio)).forEach(p=>{ (porVehiculo[p.vehiculo||'']=porVehiculo[p.vehiculo||'']||[]).push(p); });

  const pedidosDB = [], rutasDB = [];
  let rutasCreadas=0, pedidosCreados=0, omitidos=0, sinChofer=0;

  Object.keys(porVehiculo).forEach(placa=>{
    const unidadId = _vehiculoAsign[placa];
    if(!unidadId){ omitidos += porVehiculo[placa].length; return; } // sin unidad asignada: no se genera ruta
    const unidad = unidades.find(u=>u.id===unidadId);
    const chofer = choferes.find(c=>c.id===_choferAsign[placa]) || null;
    if(!chofer) sinChofer++;
    const stops = porVehiculo[placa].filter(p=>p.lat!=null && p.lng!=null);
    const sinGeo = porVehiculo[placa].filter(p=>p.lat==null || p.lng==null);

    const orden = optimizarRuta(origenTienda, stops.map(s=>({id:s.folio,lat:s.lat,lng:s.lng})));
    const rutaId = crypto.randomUUID();
    const pedidoIdsRuta = [];

    [...orden.map(o=>stops.find(s=>s.folio===o.id)), ...sinGeo].forEach((p,idx)=>{
      const pid = crypto.randomUUID();
      const {_tmpId, ...pClean} = p;
      pedidosDB.push(Object.assign({}, pClean, {
        id:pid, fecha, centroId, rutaId, ordenEnRuta: idx<orden.length?idx+1:null, estatus:'pendiente', intento:1
      }));
      pedidoIdsRuta.push(pid);
      pedidosCreados++;
    });

    rutasDB.push({
      id:rutaId, fecha, choferId: chofer?chofer.id:null, unidadId: unidad?unidad.id:null, centroId, origenTiendaId,
      estatus:'pendiente', pedidoIds:pedidoIdsRuta, ordenOptimizado: pedidoIdsRuta.slice(0,orden.length),
      horaInicio:null, horaFin:null, vehiculoTexto:placa, kmPlan:kmDeSecuencia(origenTienda, orden), kmGps:0
    });
    rutasCreadas++;
  });

  if(!rutasCreadas){ Util.toast('No se generó ninguna ruta: asigna una unidad a por lo menos un vehículo','err'); return; }
  DB.insertMany('rutas',rutasDB); DB.insertMany('pedidos',pedidosDB); // rutas primero: los pedidos las referencian
  try{ localStorage.setItem('mpr_carga', JSON.stringify({centroId, tiendaId:origenTiendaId})); }catch(e){}
  if(omitidos) Util.toast(`${omitidos} pedido(s) no se enrutaron por vehículos sin unidad asignada`,'err');
  _importState=null; _vehiculoAsign={}; _choferAsign={};
  Util.toast(`Se generaron ${rutasCreadas} rutas con ${pedidosCreados} pedidos`,'ok');
  el.innerHTML = `<div class="panel"><div class="panel-b" style="text-align:center;padding:40px">
    <h2 style="font-size:22px">✅ Rutas generadas</h2>
    <p class="muted">${rutasCreadas} rutas · ${pedidosCreados} pedidos · ${Util.num(Util.suma(rutasDB,r=>r.kmPlan),0)} km estimados · Fecha: ${Util.fmtDate(fecha)}</p>
    ${dups.size?`<p class="small muted">${dups.size} folio(s) ya cargados se omitieron.</p>`:''}
    ${sinChofer?`<p class="small" style="color:#b3261e;font-weight:700">${sinChofer} ruta(s) quedaron sin chofer: asígnalo en Monitoreo para que le aparezca en la app.</p>`:''}
    <div style="display:flex;gap:10px;justify-content:center;margin-top:16px">
      <a class="btn primary" href="#/monitoreo">Ver en monitoreo</a>
      <a class="btn" href="#/cargar-rutas" onclick="route();return false;">Cargar otro archivo</a>
    </div>
  </div></div>`;
  // Si la fecha cargada no es hoy, Monitoreo abre en esa fecha
  _monFecha = fecha;
}

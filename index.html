        <td class="small">${ult?('Folio '+Util.esc(DB.find('pedidos',ult.pedidoId)?.folio||'')+' · '+Util.fmtTime(ult.horaEntrega)):'—'}
          ${r.estatus==='en_curso'?`<div style="${sinS?'color:#b3261e;font-weight:700':'color:var(--text-mute)'}">📡 ${r.ultimaUbicacion?'GPS '+Util.hace(r.ultimaUbicacion):'Sin señal GPS aún'}</div>`:''}</td>
        <td style="white-space:nowrap">${tel?`<a class="icon-btn" href="tel:${tel}" title="Llamar al chofer" data-nofila>📞</a> `:''}<button class="icon-btn" data-editruta="${r.id}" title="Editar ruta">✎</button> <button class="icon-btn" data-delruta="${r.id}" title="Eliminar ruta">🗑</button></td>
      </tr>`;
    }).join('') : `<tr><td colspan="9" class="empty">No hay rutas que coincidan con los filtros. ${puedeEditar()?'<a href="#/cargar-rutas">Cargar rutas →</a>':''}</td></tr>`;

    el.querySelectorAll('[data-verruta]').forEach(tr=>tr.onclick=(e)=>{
      if(e.target.closest('[data-editruta]')||e.target.closest('[data-delruta]')||e.target.closest('[data-nofila]')) return;
      openDetalleRutaModal(tr.dataset.verruta);
    });
    el.querySelectorAll('[data-editruta]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); openEditarRutaModal(b.dataset.editruta, ()=>refresh(true)); });
    el.querySelectorAll('[data-delruta]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); eliminarRuta(b.dataset.delruta, ()=>refresh(true)); });

    el.querySelector('#legend').innerHTML = rutas.map(r=>{
      const ch=choferes.find(c=>c.id===r.choferId);
      return `<div class="li"><span class="sw" style="background:${colorForChofer(r.choferId,choferes)}"></span>${Util.esc(ch?.nombre||r.vehiculoTexto||'—')}</div>`;
    }).join('') + (rutas.length?'<span class="mute2 small" style="margin-left:auto">┄ plan · ━ recorrido real (GPS cada '+CFG.minutosUbicacion+' min) · 🚚 unidad en vivo · ⚠️ incidencia</span>':'<span class="mute2 small">Sin rutas para mostrar</span>');

    drawMap(map, mapLayer, rutas, pedidos, centros, choferes, fit);
    // El recorrido GPS se pide aparte (solo de las rutas en pantalla) y se pinta al llegar.
    Ubic.cargar(rutas.filter(r=>r.estatus!=='pendiente').map(r=>r.id)).then(nuevo=>{
      if(nuevo && el.isConnected) drawMap(map, mapLayer, rutas, pedidos, centros, choferes, fit);
    });
  }
  draw();
}

/* Vuelve a programar pedidos no entregados: crea una ruta nueva con una copia de cada pedido
   (mismo folio, intento + 1) que apunta al intento anterior. El pedido original queda como está. */
function openReprogramarModal(centroId, onDone){
  const lista = pedidosPorReprogramar(centroId).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  if(!lista.length){ Util.toast('No hay pedidos pendientes de reprogramar','ok'); return; }
  const unidades=DB.get('unidades').filter(u=>u.estatus!=='mantenimiento'), choferes=DB.get('choferes').filter(c=>c.estatus!=='inactivo');
  const tiendas=DB.get('tiendas').filter(t=>t.lat!=null&&t.lng!=null).sort((a,b)=>(b.esOrigen?1:0)-(a.esOrigen?1:0));
  const entDe = id=>DB.get('entregas').filter(e=>e.pedidoId===id).sort((a,b)=>new Date(b.horaEntrega)-new Date(a.horaEntrega))[0];
  const manana = Util.dateISO(new Date(Date.now()+86400000));
  const origenPrev = DB.find('rutas',lista[0].rutaId)?.origenTiendaId;
  openModalCustom('reprogModal', `Reprogramar pedidos no entregados (${lista.length})`, `
    <div class="field-row">
      <div class="field"><label>Fecha de la nueva ruta</label><input type="date" id="rpFecha" value="${manana}" min="${Util.todayISO()}"></div>
      <div class="field"><label>Unidad</label><select id="rpUnidad">${optSel(unidades.map(u=>[u.id,u.placa]),'', '— Selecciona —')}</select></div>
      <div class="field"><label>Chofer</label><select id="rpChofer">${optSel(choferes.map(c=>[c.id,c.nombre]),'', '— Selecciona —')}</select></div>
    </div>
    <div class="field"><label>Punto de salida</label><select id="rpOrigen">${optSel(tiendas.map(t=>[t.id,(t.esOrigen?'🟢 ':'')+t.nombre]),origenPrev,'— Selecciona —')}</select></div>
    <div class="table-wrap" style="max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:8px">
      <table><thead><tr><th><input type="checkbox" id="rpTodos" checked></th><th>Folio</th><th>Cliente</th><th>Resultado</th><th>Motivo</th><th>Fecha original</th><th>Fecha propuesta</th></tr></thead>
      <tbody>${lista.map(p=>{ const e=entDe(p.id); return `<tr>
        <td><input type="checkbox" data-rp="${p.id}" checked></td><td class="mono">${Util.esc(p.folio)}${(p.intento||1)>1?` <span class="badge b-amber">Intento ${p.intento}</span>`:''}</td>
        <td>${Util.esc(p.nombreContacto||'—')}<div class="small mute2">${Util.esc(p.direccion||'')}</div></td><td>${estatusBadge(p.estatus)}</td>
        <td class="small">${Util.esc(e?.motivo||'—')}</td><td class="small">${Util.fmtDate(p.fecha)}</td><td class="small">${e?.nuevaFecha?Util.fmtDate(e.nuevaFecha):'—'}</td></tr>`; }).join('')}</tbody></table>
    </div>
    <div class="small muted" style="margin-top:10px">Se crea una ruta nueva optimizada. El cliente verá el nuevo intento al rastrear su folio; el historial del intento anterior se conserva.</div>
  `, [{label:'Cancelar', cls:'btn', action:'cancel'},{label:'Crear ruta de reintento', cls:'btn primary', action:'crear'}], (action, m)=>{
    if(action==='cancel'){ closeCustomModal('reprogModal'); return; }
    const fecha=m.querySelector('#rpFecha').value, unidad=DB.find('unidades',m.querySelector('#rpUnidad').value);
    const chofer=DB.find('choferes',m.querySelector('#rpChofer').value), origen=DB.find('tiendas',m.querySelector('#rpOrigen').value);
    const ids=[...m.querySelectorAll('[data-rp]:checked')].map(c=>c.dataset.rp);
    if(!fecha||!unidad||!chofer||!origen){ Util.toast('Completa fecha, unidad, chofer y punto de salida','err'); return; }
    if(!ids.length){ Util.toast('Selecciona al menos un pedido','err'); return; }
    const sel=ids.map(id=>DB.find('pedidos',id)).filter(Boolean);
    const conGeo=sel.filter(p=>p.lat!=null&&p.lng!=null), sinGeo=sel.filter(p=>p.lat==null||p.lng==null);
    const orden=optimizarRuta(origen, conGeo.map(p=>({id:p.id,lat:p.lat,lng:p.lng})));
    const rutaId=crypto.randomUUID(), centro=unidad.centroId||sel[0].centroId, nuevos=[];
    [...orden.map(o=>conGeo.find(p=>p.id===o.id)), ...sinGeo].forEach((p,i)=>{
      nuevos.push(Object.assign({}, p, {id:crypto.randomUUID(), createdAt:Util.nowISO(), rutaId, centroId:centro, fecha, estatus:'pendiente', horaLlegada:null,
        ordenEnRuta:i<orden.length?i+1:null, intento:(p.intento||1)+1, reintentoDe:p.id, vehiculo:unidad.placa}));
    });
    DB.insertMany('rutas',[{id:rutaId, fecha, choferId:chofer.id, unidadId:unidad.id, centroId:centro, origenTiendaId:origen.id, estatus:'pendiente',
      pedidoIds:nuevos.map(p=>p.id), ordenOptimizado:nuevos.slice(0,orden.length).map(p=>p.id), horaInicio:null, horaFin:null,
      vehiculoTexto:unidad.placa, kmPlan:kmDeSecuencia(origen,orden), kmGps:0}]);
    DB.insertMany('pedidos',nuevos);
    closeCustomModal('reprogModal');
    Util.toast(`Ruta de reintento creada para el ${Util.fmtDate(fecha)} con ${nuevos.length} pedido(s)`,'ok');
    if(onDone) onDone();
  });
  const m=document.getElementById('reprogModal');
  m.querySelector('#rpTodos').onchange=e=>m.querySelectorAll('[data-rp]').forEach(c=>c.checked=e.target.checked);
  m.querySelector('#rpUnidad').onchange=e=>{ const u=DB.find('unidades',e.target.value); if(u&&u.choferId) m.querySelector('#rpChofer').value=u.choferId; };
}

/* ---- Edición de una ruta ya generada: reasignar chofer/unidad y corregir pedidos ---- */
/* Elimina una ruta cargada por error, junto con sus pedidos y entregas asociadas. */
function eliminarRuta(rutaId, onDeleted){
  const ruta = DB.find('rutas', rutaId);
  if(!ruta) return;
  const pedidos = DB.get('pedidos').filter(p=>p.rutaId===rutaId);
  const totalEntregas = DB.get('entregas').filter(e=>e.rutaId===rutaId).length;
  const msg = `¿Eliminar esta ruta? Se borrarán ${pedidos.length} pedido(s)${totalEntregas?` y ${totalEntregas} entrega(s) ya registradas`:''}. Esta acción no se puede deshacer.`;
  if(!confirm(msg)) return;
  DB._c.pedidos = DB.get('pedidos').filter(p=>p.rutaId!==rutaId);
  DB._c.entregas = DB.get('entregas').filter(e=>e.rutaId!==rutaId);
  DB.remove('rutas', rutaId); // pedidos, entregas y recorrido GPS se borran en cascada en la base
  Util.toast('Ruta eliminada','ok');
  if(onDeleted) onDeleted();
}

function openEditarRutaModal(rutaId, onSaved){
  let ruta = DB.find('rutas', rutaId);
  if(!ruta) return;
  const unidades=DB.get('unidades'), choferes=DB.get('choferes');
  // En el orden en que se recorren: primero el orden optimizado, luego las paradas sin coordenadas.
  const ordenIni = [...(ruta.ordenOptimizado||[]), ...ruta.pedidoIds.filter(id=>!(ruta.ordenOptimizado||[]).includes(id))];
  let pedidosRuta = ordenIni.map(pid=>DB.find('pedidos',pid)).filter(Boolean);

  function render(){
    openModalCustom('editarRutaModal', `Editar ruta — ${Util.esc(ruta.vehiculoTexto||'')}`, `
      <div class="field-row">
        <div class="field"><label>Chofer</label><select id="erChofer"><option value="">Sin asignar</option>${choferes.map(c=>`<option value="${c.id}" ${ruta.choferId===c.id?'selected':''}>${Util.esc(c.nombre)}</option>`).join('')}</select></div>
        <div class="field"><label>Unidad</label><select id="erUnidad"><option value="">Sin asignar</option>${unidades.map(u=>`<option value="${u.id}" ${ruta.unidadId===u.id?'selected':''}>${Util.esc(u.placa)}</option>`).join('')}</select></div>
      </div>
      <div class="small muted" style="margin:4px 0 10px">Corrige los pedidos con datos faltantes o incorrectos (dirección, teléfono, coordenadas).</div>
      <div class="table-wrap" style="max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:8px">
        <table><thead><tr><th>Orden</th><th>Folio</th><th>Cliente</th><th>Dirección</th><th>Teléfono</th><th>Lat</th><th>Lng</th></tr></thead>
        <tbody>${pedidosRuta.map((p,i)=>`<tr data-pedidorow="${p.id}" style="${p.estatus!=='pendiente'?'opacity:.6':''}">
          <td style="white-space:nowrap"><b>${i+1}</b> ${p.estatus==='pendiente'?`<button type="button" class="icon-btn" data-mover="-1" data-pid="${p.id}" title="Subir" ${i===0?'disabled':''}>↑</button><button type="button" class="icon-btn" data-mover="1" data-pid="${p.id}" title="Bajar" ${i===pedidosRuta.length-1?'disabled':''}>↓</button>`:estatusBadge(p.estatus)}</td>
          <td class="mono">${Util.esc(p.folio)}</td>
          <td><input data-f="nombreContacto" value="${Util.esc(p.nombreContacto||'')}" style="width:130px"></td>
          <td><input data-f="direccion" value="${Util.esc(p.direccion||'')}" style="width:160px"></td>
          <td><input data-f="telefono" value="${Util.esc(p.telefono||'')}" style="width:100px"></td>
          <td><input data-f="lat" type="number" step="any" value="${p.lat!=null?p.lat:''}" style="width:90px"></td>
          <td><input data-f="lng" type="number" step="any" value="${p.lng!=null?p.lng:''}" style="width:90px"></td>
        </tr>`).join('')}</tbody></table>
      </div>
      <div class="small muted" style="margin-top:10px">Usa ↑ ↓ para cambiar el orden a mano, o "Reoptimizar orden" para recalcularlo con las coordenadas actuales (solo paradas pendientes). ${ruta.estatus!=='pendiente'?'<b>La ruta ya inició:</b> el chofer verá los cambios al tocar "Volver a descargar mi ruta" en su app.':'El chofer recibe los cambios al abrir su app.'}</div>
    `, [
      {label:'Cancelar', cls:'btn', action:'cancel'},
      {label:'🗑 Eliminar ruta', cls:'btn danger', action:'eliminar'},
      {label:'Reoptimizar orden', cls:'btn', action:'reoptimizar'},
      {label:'Guardar cambios', cls:'btn primary', action:'guardar'}
    ], (action, modalEl)=>{
      if(action==='cancel'){ closeCustomModal('editarRutaModal'); return; }
      if(action==='eliminar'){
        closeCustomModal('editarRutaModal');
        eliminarRuta(ruta.id, onSaved);
        return;
      }
      recolectar(modalEl);
      const choferId = ruta.choferId, unidadId = ruta.unidadId;

      if(action==='reoptimizar'){
        const origen = resolverOrigenRuta(ruta);
        const conGeo = pedidosRuta.filter(p=>p.lat!=null && p.lng!=null && p.estatus==='pendiente');
        const yaCerrados = pedidosRuta.filter(p=>p.estatus!=='pendiente');
        const sinGeo = pedidosRuta.filter(p=>p.estatus==='pendiente' && (p.lat==null||p.lng==null));
        const orden = optimizarRuta(origen, conGeo.map(p=>({id:p.id,lat:p.lat,lng:p.lng})));
        const nuevoOrden = [...yaCerrados, ...orden.map(o=>conGeo.find(p=>p.id===o.id)), ...sinGeo];
        nuevoOrden.forEach((p,idx)=>{ p.ordenEnRuta = idx+1; });
        pedidosRuta = nuevoOrden;
        Util.toast('Orden recalculado','ok');
        render();
        return;
      }

      pedidosRuta.forEach(p=>DB.update('pedidos', p.id, {
        nombreContacto:p.nombreContacto, direccion:p.direccion, telefono:p.telefono, lat:p.lat, lng:p.lng, ordenEnRuta:p.ordenEnRuta
      }));
      pedidosRuta.forEach((p,i)=>{ p.ordenEnRuta=i+1; });
      const conGeo = pedidosRuta.filter(p=>p.lat!=null&&p.lng!=null);
      DB.update('rutas', ruta.id, {
        choferId, unidadId, pedidoIds: pedidosRuta.map(p=>p.id),
        ordenOptimizado: conGeo.map(p=>p.id), kmPlan: kmDeSecuencia(resolverOrigenRuta(ruta), conGeo)
      });
      closeCustomModal('editarRutaModal');
      Util.toast(choferId?'Ruta actualizada':'Ruta guardada SIN chofer: no le aparece a nadie en la app', choferId?'ok':'err');
      if(onSaved) onSaved();
    });
    const m=document.getElementById('editarRutaModal');
    m.querySelectorAll('[data-mover]').forEach(b=>b.onclick=()=>{
      recolectar(m);
      const i=pedidosRuta.findIndex(p=>p.id===b.dataset.pid), j=i+Number(b.dataset.mover);
      if(i<0||j<0||j>=pedidosRuta.length) return;
      [pedidosRuta[i],pedidosRuta[j]]=[pedidosRuta[j],pedidosRuta[i]];
      render();
    });
    m.querySelector('#erUnidad').onchange=e=>{ const u=DB.find('unidades',e.target.value); if(u&&u.choferId&&!m.querySelector('#erChofer').value) m.querySelector('#erChofer').value=u.choferId; };
  }
  // Pasa a memoria lo capturado en la tabla y en los selectores (antes de redibujar o guardar).
  function recolectar(modalEl){
    pedidosRuta = pedidosRuta.map(p=>Object.assign({},p));
    modalEl.querySelectorAll('[data-pedidorow]').forEach(row=>{
      const p=pedidosRuta.find(x=>x.id===row.dataset.pedidorow);
      if(!p) return;
      row.querySelectorAll('[data-f]').forEach(inp=>{
        const f=inp.dataset.f;
        p[f] = f==='lat' ? Util.parseLat(inp.value) : f==='lng' ? Util.parseLng(inp.value) : inp.value;
      });
    });
    ruta = Object.assign({}, ruta, {choferId: modalEl.querySelector('#erChofer').value || null, unidadId: modalEl.querySelector('#erUnidad').value || null});
  }
  render();
}

/* ---- Detalle de una ruta: lista de envíos (pedidos) y su evidencia de entrega ---- */
function openDetalleRutaModal(rutaId){
  const ruta = DB.find('rutas', rutaId);
  if(!ruta) return;
  const choferes=DB.get('choferes'), unidades=DB.get('unidades'), centros=DB.get('centros'), entregas=DB.get('entregas');
  const ch=choferes.find(c=>c.id===ruta.choferId), un=unidades.find(u=>u.id===ruta.unidadId), ce=centros.find(c=>c.id===ruta.centroId);
  const origenRuta = resolverOrigenRuta(ruta);
  // Orden optimizado y, al final, las paradas sin coordenadas (antes no aparecían en el detalle).
  const ordenIds = [...(ruta.ordenOptimizado||[]), ...ruta.pedidoIds.filter(id=>!(ruta.ordenOptimizado||[]).includes(id))];
  const pedidos = ordenIds.map(pid=>DB.find('pedidos',pid)).filter(Boolean);
  const kmR = kmRealRuta(ruta), chk = ruta.checklistSalida;
  const fallas = chk && typeof chk==='object' ? Object.entries(chk).filter(([,v])=>v===false).map(([k])=>k) : [];
  const incs = DB.query('incidencias', i=>i.rutaId===ruta.id);
  const entregadas = pedidos.filter(p=>p.estatus==='entregado').length;
  const fallidas = pedidos.filter(p=>ESTATUS_NO_EXITOSOS.includes(p.estatus)).length;

  const tituloRuta = ch ? ch.nombre : (un ? un.placa : (ruta.vehiculoTexto || 'sin asignar'));
  openModalCustom('detalleRutaModal', `Envíos de la ruta — ${Util.esc(tituloRuta)}`, `
    <div class="small muted" style="margin-bottom:10px">
      <b>${Util.esc(ch?.nombre||'Sin chofer asignado')}</b> · ${Util.esc(un?.placa||ruta.vehiculoTexto||'—')} · ${Util.esc(ce?.nombre||'—')} · ${Util.fmtDate(ruta.fecha)}
      ${ruta.horaInicio?(' · Inicio '+Util.fmtTime(ruta.horaInicio)):''}${ruta.horaFin?(' · Fin '+Util.fmtTime(ruta.horaFin)):''}${resumenNotificacionInicio(ruta)}
    </div>
    <div class="grid cols-4" style="margin-bottom:14px">
      <div class="card"><h3>Paradas</h3><div class="stat small-stat">${pedidos.length}</div></div>
      <div class="card"><h3>Entregadas</h3><div class="stat small-stat" style="color:var(--success)">${entregadas}</div></div>
      <div class="card"><h3>Con incidencia</h3><div class="stat small-stat" style="color:var(--danger)">${fallidas}</div></div>
      <div class="card"><h3>Estatus ruta</h3><div style="margin-top:4px">${estatusBadge(ruta.estatus)}</div></div>
    </div>
    <div class="small" style="margin:-4px 0 12px;line-height:1.9">
      🛣️ <b>Km:</b> ${kmR!=null?Util.num(kmR,1)+' recorridos':'—'}${ruta.kmPlan?' · '+Util.num(ruta.kmPlan,1)+' planeados':''}
      ${ruta.odometroInicio!=null?` · <b>Odómetro:</b> ${Util.num(ruta.odometroInicio,0)}${ruta.odometroFin!=null?' → '+Util.num(ruta.odometroFin,0):''}`:''}
      ${ruta.combustibleInicio?` · ⛽ ${Util.esc(ruta.combustibleInicio)}`:''}
      ${ruta.horaInicio&&ruta.horaFin?` · ⏱ ${Util.fmtMins(Util.minsBetween(ruta.horaInicio,ruta.horaFin))}`:''}
      ${chk?` · <b>Revisión de salida:</b> ${fallas.length?`<span class="badge b-red">Con falla: ${Util.esc(fallas.join(', '))}</span>`:'<span class="badge b-green">Sin fallas</span>'}`:''}
      ${incs.length?` · <span class="badge ${incs.some(i=>!i.atendida)?'b-red':'b-gray'}">${incs.length} incidencia(s)</span>`:''}
    </div>
    <div class="table-wrap" style="max-height:360px;overflow-y:auto;border:1px solid var(--border);border-radius:8px">
      <table><thead><tr><th>#</th><th>Folio</th><th>Cliente</th><th>Estatus</th><th>Llegada</th><th>Salida</th><th>En sitio</th><th></th></tr></thead>
      <tbody>
        ${origenRuta?`<tr style="background:var(--success-soft)">
          <td>🟢</td><td><b>Salida</b></td><td>${Util.esc(origenRuta.nombre)}</td>
          <td><span class="badge b-green">Punto de partida</span></td>
          <td class="small">—</td><td class="small">${ruta.horaInicio?Util.fmtTime(ruta.horaInicio):'—'}</td><td class="small">—</td><td></td>
        </tr>`:''}
        ${pedidos.length?pedidos.map((p,i)=>{
        const ent = entregas.find(e=>e.pedidoId===p.id);
        const enSitio = p.horaLlegada && ent ? Util.minsBetween(p.horaLlegada, ent.horaEntrega) : null;
        return `<tr>
          <td>${p.ordenEnRuta||i+1}</td><td class="mono">${Util.esc(p.folio)}</td><td>${Util.esc(p.nombreContacto||'—')}</td>
          <td>${estatusBadge(p.estatus)}</td>
          <td class="small">${p.horaLlegada?Util.fmtTime(p.horaLlegada):'—'}</td>
          <td class="small">${ent?Util.fmtTime(ent.horaEntrega):'—'}</td>

      }).join(''):`<tr><td colspan="8" class="empty">Esta ruta no tiene envíos.</td></tr>`}
        ${origenRuta?`<tr style="background:var(--danger-soft)">
          <td>🔴</td><td><b>Regreso</b></td><td>${Util.esc(origenRuta.nombre)}</td>

    if(action==='cerrar') closeCustomModal('detalleRutaModal');
  });

/* Pinta cada ruta en el color de su chofer:
   - línea punteada: el plan (salida → paradas en orden óptimo → regreso)
   - línea continua: el recorrido real reportado por la app del chofer (GPS)
   - 🚚: última posición conocida de la unidad mientras la ruta está en curso */
function drawMap(map, mapLayer, rutas, pedidos, centros, choferes, fit){
  mapLayer.clearLayers();
  const pts=[];
  const unidades=DB.get('unidades');
  rutas.forEach(r=>{
    const color=colorForChofer(r.choferId,choferes);
    const seq = construirSecuenciaConSalidaRegreso(r, pedidos);
    if(seq.length>1){
      L.polyline(seq.map(p=>[p.lat,p.lng]), {color, weight:2, opacity:.55, dashArray:'5 9'}).addTo(mapLayer);
    }
    seq.forEach(p=>{
      pts.push([p.lat,p.lng]);
      if(p.esSalida){
        L.circleMarker([p.lat,p.lng], {radius:7, color:'#fff', weight:2, fillColor:'#2dce89', fillOpacity:1})
          .bindPopup(`<b>${Util.esc(p.nombre||'Tienda de origen')}</b><br>🟢 Salida de sucursal${p.hora?' · '+Util.fmtTime(p.hora):''}`).addTo(mapLayer);
        return;
      }
      if(p.esRegreso){
        L.circleMarker([p.lat,p.lng], {radius:7, color:'#fff', weight:2, fillColor:'#f5365c', fillOpacity:1})
          .bindPopup(`<b>${Util.esc(p.nombre||'Tienda de origen')}</b><br>🔴 Regreso / fin de ruta${p.hora?' · '+Util.fmtTime(p.hora):''}`).addTo(mapLayer);
        return;
      }
      const entregado = p.estatus==='entregado', noExitoso = ESTATUS_NO_EXITOSOS.includes(p.estatus);
      const fill = entregado?'#16a34a':noExitoso?'#fb6340':color;
      L.circleMarker([p.lat,p.lng], {radius:5.5, color:'#fff', weight:1.5, fillColor:fill, fillOpacity:1})
        .bindPopup(`<b>Folio ${Util.esc(p.folio)}</b><br>${Util.esc(p.nombreContacto||'')}<br>${Util.esc(p.direccion||'')}<br>${estatusBadge(p.estatus)}`)
        .addTo(mapLayer);
    });

    // Recorrido real
    const track = Ubic.de(r.id);
    if(track.length>1) L.polyline(track.map(u=>[u.lat,u.lng]), {color, weight:4.5, opacity:.95, lineJoin:'round'}).addTo(mapLayer);
    track.forEach(u=>{
      pts.push([u.lat,u.lng]);
      L.circleMarker([u.lat,u.lng], {radius:3, color, weight:1, fillColor:'#fff', fillOpacity:1})
        .bindPopup(`📡 ${Util.fmtTime(u.registradaEn)}${u.velocidadKmh!=null?' · '+Math.round(u.velocidadKmh)+' km/h':''}`).addTo(mapLayer);
    });
    const ult = track.length ? track[track.length-1]
      : (r.ultimaLat!=null ? {lat:r.ultimaLat, lng:r.ultimaLng, registradaEn:r.ultimaUbicacion} : null);
    if(ult && r.estatus==='en_curso'){
      const ch=choferes.find(c=>c.id===r.choferId), un=unidades.find(u=>u.id===r.unidadId);
      const viejo = Util.minsBetween(ult.registradaEn, Util.nowISO()) > 12;
      pts.push([ult.lat,ult.lng]);
      L.marker([ult.lat,ult.lng], {zIndexOffset:1000, icon:L.divIcon({className:'', iconSize:[34,34], iconAnchor:[17,17],
        html:`<div class="unit-pin ${viejo?'sin-senal':''}" style="--c:${color}">🚚</div>`})})
        .bindPopup(`<b>${Util.esc(un?.placa||r.vehiculoTexto||'Unidad')}</b><br>${Util.esc(ch?.nombre||'')}<br>📡 ${Util.fmtTime(ult.registradaEn)} (${Util.hace(ult.registradaEn)})${viejo?'<br><b style="color:#c94a2c">Sin señal reciente</b>':''}`)
        .addTo(mapLayer);
    }
  });
  // Incidencias reportadas por los choferes de las rutas en pantalla
  const idsRutas = new Set(rutas.map(r=>r.id));
  DB.query('incidencias', i=>idsRutas.has(i.rutaId) && i.lat!=null && i.lng!=null).forEach(i=>{
    L.marker([i.lat,i.lng], {zIndexOffset:900, icon:L.divIcon({className:'', iconSize:[26,26], iconAnchor:[13,13],
      html:`<div style="width:26px;height:26px;border-radius:50%;background:${i.atendida?'#e9ecef':'#fff'};border:2px solid ${i.atendida?'#8392ab':'#d03b3b'};display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.3)">⚠️</div>`})})
      .bindPopup(`<b>${Util.esc(TIPOS_INCIDENCIA[i.tipo]||i.tipo)}</b><br>${Util.esc(i.descripcion||'')}<br>${Util.fmtTime(i.hora)} · ${i.atendida?'Atendida':'<b style="color:#b3261e">Sin atender</b>'}`).addTo(mapLayer);
  });
  if(!fit) return;
  if(pts.length){ map.fitBounds(L.latLngBounds(pts), {padding:[24,24], maxZoom:14}); }
  else { map.setView([23.6345,-102.5528],5); }
}

/* Resuelve el punto real de origen/regreso de una ruta: la tienda de origen
   configurada (ruta.origenTiendaId) — las que llevan coordenadas. El centro
   (razón social) es solo agrupador administrativo y NO se usa para esto; se
   deja como respaldo únicamente para rutas antiguas que aún no tenían tienda
   de origen y sí tenían coordenadas cargadas directamente en el centro. */
function resolverOrigenRuta(ruta){
  const t = ruta.origenTiendaId ? DB.find('tiendas', ruta.origenTiendaId) : null;
  if(t && t.lat!=null && t.lng!=null) return {lat:t.lat, lng:t.lng, nombre:t.nombre};
  const c = ruta.centroId ? DB.find('centros', ruta.centroId) : null;
  if(c && c.lat!=null && c.lng!=null) return {lat:c.lat, lng:c.lng, nombre:c.nombre};
  return null;
}

/* Arma la secuencia completa de una ruta: salida de la tienda de origen (verde)
   + paradas reales en orden óptimo + regreso a la misma tienda (rojo) — para
   mapa y detalle. */
function construirSecuenciaConSalidaRegreso(ruta, pedidosDB){
  const seq=[];
  const origen = resolverOrigenRuta(ruta);
  if(origen) seq.push({lat:origen.lat, lng:origen.lng, esSalida:true, hora:ruta.horaInicio, nombre:origen.nombre});
  (ruta.ordenOptimizado&&ruta.ordenOptimizado.length?ruta.ordenOptimizado:ruta.pedidoIds).forEach(pid=>{
    const p = DB.find('pedidos',pid);
    if(p&&p.lat!=null&&p.lng!=null) seq.push(p);
  });
  if(origen) seq.push({lat:origen.lat, lng:origen.lng, esRegreso:true, hora:ruta.horaFin, nombre:origen.nombre});
  return seq;
}

  function refresh(){

    let rutas = DB.get('rutas').filter(r=> r.fecha>=filtros.desde && r.fecha<=filtros.hasta );

    _rutasHist = rutas;
    const concluidas = rutas.filter(r=>r.estatus==='concluida');
    const totalParadas = rutas.reduce((s,r)=>s+r.pedidoIds.length,0);
    const totalExitosas = rutas.reduce((s,r)=>s+r.pedidoIds.filter(pid=>DB.find('pedidos',pid)?.estatus==='entregado').length,0);
    const duraciones = concluidas.filter(r=>r.horaInicio&&r.horaFin).map(r=>Util.minsBetween(r.horaInicio,r.horaFin));
    const promDuracion = duraciones.length ? Math.round(duraciones.reduce((a,b)=>a+b,0)/duraciones.length) : null;

    el.querySelector('#hStats').innerHTML = `
      <div class="card"><h3>Rutas en periodo</h3><div class="stat">${rutas.length}</div></div>
      <div class="card"><h3>Paradas totales</h3><div class="stat">${totalParadas}</div></div>
      <div class="card"><h3>% Entregas exitosas</h3><div class="stat" style="color:var(--success)">${totalParadas?Math.round(totalExitosas/totalParadas*100):0}%</div></div>
      <div class="card"><h3>Duración promedio</h3><div class="stat small-stat">${Util.fmtMins(promDuracion)}</div></div>`;

    el.querySelector('#hBody').innerHTML = rutas.length ? rutas.sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(r=>{
      const ch=choferes.find(c=>c.id===r.choferId), un=unidades.find(u=>u.id===r.unidadId), ce=centros.find(c=>c.id===r.centroId);
      const exitosas=r.pedidoIds.filter(pid=>DB.find('pedidos',pid)?.estatus==='entregado').length;
      const dur = r.horaInicio&&r.horaFin ? Util.minsBetween(r.horaInicio,r.horaFin) : null;
      const prom = dur && r.pedidoIds.length ? Math.round(dur/r.pedidoIds.length) : null;
      return `<tr data-verruta="${r.id}" style="cursor:pointer" title="Ver envíos de esta ruta">
        <td>${Util.fmtDate(r.fecha)}</td><td>${Util.esc(ch?.nombre||'—')}</td><td class="mono">${Util.esc(un?.placa||'—')}</td>
        <td>${Util.esc(ce?.nombre||'—')}</td><td>${r.pedidoIds.length}</td>
        <td>${exitosas}/${r.pedidoIds.length}</td><td>${Util.fmtMins(dur)}</td><td>${Util.fmtMins(prom)}</td>
        <td>${estatusBadge(r.estatus)}</td>
      </tr>`;
    }).join('') : `<tr><td colspan="9" class="empty">No hay rutas en ese periodo/filtros.</td></tr>`;
    el.querySelectorAll('[data-verruta]').forEach(tr=>tr.onclick=()=>openDetalleRutaModal(tr.dataset.verruta));
  }
  draw();
}

/* ============================================================
   17. ESTATUS DE ENTREGA
   (La app del chofer ya no vive en este archivo: está en chofer/index.html,
   que es también lo que se empaqueta en el APK.)
   ============================================================ */
// Estatus de pedido "cerrados" (ya no se van a reintentar en esta ruta) que no son un éxito.
const ESTATUS_NO_EXITOSOS = ['cliente_ausente','reprogramado','cancelado_sucursal','fallido'];
function esEstatusCerrado(estatus){ return estatus==='entregado' || ESTATUS_NO_EXITOSOS.includes(estatus); }

function resumenNotificacionInicio(ruta){
  const n = ruta.notificacionInicio;
  if(!n) return '';
  if(n.estatus==='no_configurado') return ' · ✉️ Aviso por correo desactivado';
  const partes = [];
  if((n.enviados||[]).length) partes.push(`${n.enviados.length} enviado(s)`);
  if((n.fallidos||[]).length) partes.push(`${n.fallidos.length} fallido(s)`);
  if((n.omitidos||[]).length) partes.push(`${n.omitidos.length} sin correo válido`);
  if(n.error && !(n.fallidos||[]).length) partes.push('error: '+n.error);
  return ` · ✉️ Aviso de salida: ${Util.esc(partes.join(', ')||'sin destinatarios')}`;
}

/* ============================================================
   18. VISTA: TRACKING PÚBLICO DEL CLIENTE
   Sin login: consulta la función mpr_tracking(folio), que devuelve solo
   lo que el cliente necesita ver de su pedido.
   ============================================================ */
function renderTracking(){
  const app=document.getElementById('app');
  app.innerHTML = `
  <div class="track-wrap"><div class="track-shell">
    <div class="auth-card">
      <div class="auth-logo"><div class="logo">MR</div><div><b>MapRoad</b><span>Rastreo de pedido</span></div></div>
      <div id="tErr"></div>
      <form id="tForm">
        <div class="field"><label>Folio de pedido</label><input name="folio" placeholder="Ej. F1000" required></div>
        <button class="btn primary block" type="submit">Rastrear pedido</button>
      </form>
    </div>
    <div id="tResult"></div>
  </div></div>`;
  document.getElementById('tForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const folio=new FormData(e.target).get('folio').trim();
    const {data,error} = await sb.rpc('mpr_tracking',{p_folio:folio});
    if(error || !data || !data.encontrado){
      document.getElementById('tErr').innerHTML=`<div class="errbox">${error?'No se pudo consultar en este momento. Intenta de nuevo.':'No encontramos ningún pedido con ese folio.'}</div>`;
      document.getElementById('tResult').innerHTML=''; return;
    }
    document.getElementById('tErr').innerHTML='';
    renderTrackingResult(data);
  });
  // Enlace directo desde el correo de "tu pedido va en camino": #/tracking?folio=F1000
  const folioLink = hashParam('folio');
  if(folioLink){
    const form=document.getElementById('tForm');
    form.folio.value=folioLink;
    form.requestSubmit();
  }
}

function renderTrackingResult(d){
  const pedido=d.pedido, ruta=d.ruta, origenRuta=d.origen, entrega=d.entrega, idx=d.idx, entregadasAntes=d.entregadasAntes;
  const yaCerrado = esEstatusCerrado(pedido.estatus);

  const ESTADO_CLIENTE_TXT = {
    entregado:'Entregado', cliente_ausente:'No se encontró al destinatario',
    reprogramado:'Entrega reprogramada', cancelado_sucursal:'Disponible para recoger en sucursal', fallido:'Entrega no completada'
  };
  const ULTIMO_PASO_TXT = {
    entregado:'Entregado', cliente_ausente:'No se encontró al destinatario',
    reprogramado:'Reprogramado', cancelado_sucursal:'Cancelado — recoge en sucursal', fallido:'Intento de entrega'
  };

  let estadoTxt;
  if(ESTADO_CLIENTE_TXT[pedido.estatus]){ estadoTxt=ESTADO_CLIENTE_TXT[pedido.estatus]; }
  else if(ruta && ruta.estatus==='en_curso'){ estadoTxt='En camino'; }
  else if(ruta && ruta.estatus==='pendiente'){ estadoTxt='Programado'; }
  else { estadoTxt='Pendiente de asignación de ruta'; }

  // El conteo de "paradas antes de la tuya" solo tiene sentido mientras va en camino.
  const conteoTxt = (!yaCerrado && idx>-1) ? ` (${idx-entregadasAntes} paradas antes de la tuya)` : '';
  const pasos = [
    {label:'Pedido registrado', done:true, hora:pedido.createdAt},
    {label:'Salió del centro de distribución', done: !!(ruta&&ruta.horaInicio), hora: ruta?.horaInicio},
    {label: pedido.horaLlegada ? 'El repartidor llegó a tu domicilio' : ('En ruta hacia tu domicilio'+conteoTxt),
      done: ruta&&ruta.estatus!=='pendiente', current: ruta&&ruta.estatus==='en_curso'&&pedido.estatus==='pendiente', hora: pedido.horaLlegada},
    {label: ULTIMO_PASO_TXT[pedido.estatus] || 'Entregado', done: yaCerrado, hora: entrega?.horaEntrega},
  ];

  // ETA con el tiempo promedio histórico por parada de ese chofer
  let etaTxt='—';
  if(ruta && ruta.estatus==='en_curso' && pedido.estatus==='pendiente' && idx>-1){
    const paradasRestantes = idx - entregadasAntes + 1;
    const minsRestantes = Math.max(5, Math.round(d.promParada*paradasRestantes));
    etaTxt = new Date(Date.now()+minsRestantes*60000).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  } else if(pedido.estatus==='entregado'){
    etaTxt = 'Entregado';
  }

  // Ubicación difuminada (no exacta) — solo una zona aproximada, nunca el punto real de la unidad
  const box = document.getElementById('tResult');
  const puedeMostrarMapa = ruta && ruta.estatus==='en_curso' && pedido.lat!=null && origenRuta;
  let fuzzed=null;
  if(puedeMostrarMapa){
    const avance = d.total ? Math.min(1,(entregadasAntes+0.5)/d.total) : 0.5;
    const approx = { lat: origenRuta.lat + (pedido.lat-origenRuta.lat)*avance, lng: origenRuta.lng + (pedido.lng-origenRuta.lng)*avance };
    fuzzed = Util.jitter(approx, 1.5);
  }

  if(_trackMap){ _trackMap.remove(); _trackMap=null; }
  box.innerHTML = `
    <div class="auth-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div><b style="font-size:16px">Folio ${Util.esc(pedido.folio)}</b><div class="small muted">${Util.esc(pedido.nombreContacto||'')}</div></div>
        <span class="badge ${pedido.estatus==='entregado'?'b-green':ESTATUS_NO_EXITOSOS.includes(pedido.estatus)?'b-amber':'b-blue'}">${Util.esc(estadoTxt)}</span>
      </div>
      ${puedeMostrarMapa?`<div id="trackMiniMap" class="trackmap" style="margin-top:14px"></div>
      <div class="small mute2" style="margin-top:6px">📍 Zona aproximada — por seguridad no se muestra el punto exacto de la unidad.</div>`:''}
      ${etaTxt!=='—'?`<div class="eta-box"><div><div class="small muted">Entrega estimada</div><b>${Util.esc(etaTxt)}</b></div><div style="font-size:26px">🚚</div></div>`:''}
      <div class="progress-track">
        ${pasos.map(p=>`<div class="p-step ${p.done?'done':''} ${p.current?'current':''}"><div class="p-dot"></div><b class="small">${Util.esc(p.label)}</b>${p.hora?`<div class="small mute2">${Util.fmtDateTime(p.hora)}</div>`:''}</div>`).join('')}
      </div>
      <hr style="border:none;border-top:1px solid var(--border);margin:14px 0">
      <div class="small muted"><b>Dirección de entrega:</b> ${Util.esc(pedido.direccion||'')}${pedido.colonia?', '+Util.esc(pedido.colonia):''}</div>
      <div class="small muted" style="margin-top:4px"><b>Chofer:</b> ${d.chofer?Util.esc(d.chofer):'Por asignar'}</div>
      ${entrega && entrega.fotos && entrega.fotos.length ? `
        <hr style="border:none;border-top:1px solid var(--border);margin:14px 0">
        <div class="small" style="margin-bottom:8px"><b>Evidencia de entrega</b></div>
        <div class="thumbs">${entrega.fotos.map(f=>`<div class="thumb"><img src="${Util.esc(f)}"></div>`).join('')}</div>
      `:''}
    </div>`;

  if(puedeMostrarMapa && fuzzed){
    _trackMap = L.map('trackMiniMap', {zoomControl:false, dragging:false, scrollWheelZoom:false, doubleClickZoom:false, attributionControl:false}).setView([fuzzed.lat,fuzzed.lng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19}).addTo(_trackMap);
    L.circle([fuzzed.lat,fuzzed.lng], {radius:1300, color:'#2563eb', weight:1.5, fillColor:'#2563eb', fillOpacity:.18}).addTo(_trackMap);
  }
}
let _trackMap=null;

/* ============================================================
   19. MODAL GENÉRICO
   ============================================================ */
function openModal(title, bodyHtml, onSave){
  const bg=document.createElement('div');
  bg.className='modal-bg';
  bg.id='genericModal';
  bg.innerHTML = `<div class="modal">
    <div class="modal-h"><b>${Util.esc(title)}</b><button class="icon-btn" id="mXClose">✕</button></div>
    <form id="mForm"><div class="modal-b">${bodyHtml}</div>
    <div class="modal-f"><button type="button" class="btn" id="mXCancel">Cancelar</button><button type="submit" class="btn primary">Guardar</button></div></form>
  </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#mXClose').onclick = bg.querySelector('#mXCancel').onclick = closeModal;
  bg.addEventListener('click', e=>{ if(e.target===bg) closeModal(); });
  bg.querySelector('#mForm').addEventListener('submit', e=>{
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    onSave(data);
  });
}
function closeModal(){ const m=document.getElementById('genericModal'); if(m) m.remove(); }

/* Modal con múltiples botones de acción (para flujos con "Reoptimizar" + "Guardar" sin cerrar) */
function openModalCustom(id, title, bodyHtml, buttons, onAction){
  closeCustomModal(id);
  const bg=document.createElement('div');
  bg.className='modal-bg';
  bg.id=id;
  bg.innerHTML = `<div class="modal wide">
    <div class="modal-h"><b>${Util.esc(title)}</b><button class="icon-btn" data-close>✕</button></div>
    <div class="modal-b">${bodyHtml}</div>
    <div class="modal-f">${buttons.map(b=>`<button type="button" class="${b.cls}" data-action="${b.action}">${Util.esc(b.label)}</button>`).join('')}</div>
  </div>`;
  document.body.appendChild(bg);
  bg.querySelector('[data-close]').onclick=()=>closeCustomModal(id);
  bg.addEventListener('click', e=>{ if(e.target===bg) closeCustomModal(id); });
  bg.querySelectorAll('[data-action]').forEach(btn=>{ btn.onclick=()=>onAction(btn.dataset.action, bg); });
}
function closeCustomModal(id){ const m=document.getElementById(id); if(m) m.remove(); }
